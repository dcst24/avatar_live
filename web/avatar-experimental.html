<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #6366f1;
            --accent-glow: #818cf8;
            --accent-dim: #4338ca;
            --danger: #ef4444;
            --bg: #09090b;
            --surface: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f4f4f5;
            --text-muted: #71717a;
            --radius: 16px;
            /* mic verde */
            --mic-green: #22c55e;
            --mic-green-dim: #15803d;
            --mic-green-glow: rgba(34, 197, 94, 0.55);
        }

        html,
        body {
            height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        /* ── Fullscreen wrapper ──────────────────────────────── */
        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* ── Avatar ocupa toda la pantalla ──────────────────── */
        #avatar-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--surface);
        }

        #video {
            width: 100%;
            height: 100%;
            /* position: absolute;
            top: 25%; */
            object-fit: contain;
            /* muestra el avatar completo sin recortar */
            object-position: center center;
            display: block;
            background: #000;
        }

        /* Gradient overlay at bottom (para legibilidad del mic) */
        #avatar-wrap::after {
            content: '';
            position: absolute;
            inset: auto 0 0 0;
            height: 30%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
            pointer-events: none;
        }

        /* Speaking indicator (ring desactivado) */
        #speaking-ring {
            display: none;
        }

        /* ── Status badge ─────────────────────────────────────── */
        #status-badge {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
            white-space: nowrap;
            transition: opacity 0.3s;
        }

        #status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
            flex-shrink: 0;
        }

        /* Status variants */
        body.state-connecting #status-dot {
            background: #f59e0b;
            animation: dot-blink 1s ease-in-out infinite;
        }

        body.state-ready #status-dot {
            background: #22c55e;
        }

        body.state-listening #status-dot {
            background: var(--accent-glow);
            animation: dot-blink 0.6s ease-in-out infinite;
        }

        body.state-processing #status-dot {
            background: #f59e0b;
            animation: dot-blink 0.4s linear infinite;
        }

        body.state-thinking #status-dot {
            background: #a78bfa;
            animation: dot-blink 0.35s linear infinite;
        }

        body.state-speaking #status-dot {
            background: #22c55e;
            animation: dot-blink 0.8s ease-in-out infinite;
        }

        @keyframes dot-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        /* ── Transcript overlay (sobre el video, arriba-izquierda) */
        #transcript-wrap {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: min(500px, 88vw);
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .transcript-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadein 0.3s ease;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transcript-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
            flex-shrink: 0;
            width: 32px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .transcript-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
        }

        .transcript-text.dim {
            color: var(--text-muted);
        }

        

        /* ── Botón MIC: oculto en modo always-on wake-word ─────────── */
        #btn-mic {
            display: none !important;
        }

        /* ── Botón conectar (top-left, discreto) ────────────── */
        #btn-connect {
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 30;

            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(24, 24, 27, 0.70);
            backdrop-filter: blur(8px);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #btn-connect:hover {
            background: rgba(39, 39, 42, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text);
        }

        #btn-connect.connected {
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* ── Botón PANTALLA COMPLETA (esquina sup-derecha, invisible) */
        #btn-fullscreen {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 50;
            width: 56px;
            height: 56px;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0;
            /* invisible */
            -webkit-tap-highlight-color: transparent;
        }

        /* Pequeño hover hint opcional — quítalo si prefieres que sea 100% invisible */
        /* #btn-fullscreen:hover { opacity: 0.15; background: white; border-radius: 0 0 0 8px; } */

        /* ── Tap overlay animation ───────────────────────────── */
        @keyframes tap-pulse {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(99, 102, 241, 0.5), 0 0 0 0 rgba(99, 102, 241, 0.4);
            }

            50% {
                box-shadow: 0 0 50px rgba(99, 102, 241, 0.8), 0 0 0 18px rgba(99, 102, 241, 0);
            }
        }

        /* ── Hidden audio / inputs ──────────────────────────── */
        audio {
            display: none;
        }

        input[type=hidden] {
            display: none;
        }

        /* ── Debug log panel ────────────────────────────────── */
        #dbg-btn {
            position: fixed;
            bottom: 52px;
            right: 20px;
            z-index: 200;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(10px);
            color: #f4f4f5;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        #dbg-btn:hover {
            background: rgba(39, 39, 42, 0.9);
        }

        #dbg-panel {
            position: fixed;
            inset: 0;
            z-index: 199;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 11px;
        }

        #dbg-panel.open {
            display: flex;
        }

        #dbg-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        #dbg-toolbar span {
            color: #a1a1aa;
            font-size: 12px;
            font-family: inherit;
        }

        #dbg-clear {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.8);
            color: #f4f4f5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        #dbg-close {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(127, 29, 29, 0.5);
            color: #fca5a5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 8px;
        }

        #dbg-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dbg-entry {
            display: flex;
            gap: 8px;
            line-height: 1.5;
            word-break: break-all;
        }

        .dbg-ts {
            color: #52525b;
            flex-shrink: 0;
        }

        .dbg-log .dbg-msg {
            color: #d4d4d8;
        }

        .dbg-warn .dbg-msg {
            color: #fbbf24;
        }

        .dbg-err .dbg-msg {
            color: #f87171;
        }

        .dbg-label-log {
            color: #6366f1;
            font-weight: 600;
            flex-shrink: 0;
        }

        .dbg-label-warn {
            color: #f59e0b;
            font-weight: 600;
            flex-shrink: 0;
        }

        .dbg-label-err {
            color: #ef4444;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* Fila de selector de mic */
        #dbg-mic-row {
            padding: 8px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        #dbg-mic-row label {
            color: #a1a1aa;
            font-size: 11px;
            font-family: inherit;
            flex-shrink: 0;
        }

        #dbg-mic-select {
            flex: 1;
            min-width: 160px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.9);
            color: #f4f4f5;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        #dbg-mic-refresh {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.8);
            color: #f4f4f5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        

        

        

        

        /* ── Responsividad en dispositivos móviles y tabletas ── */
        @media (max-width: 768px) {
            /* Video cubre toda la pantalla en móviles, recortando lados si el video es horizontal */
            #video {
                object-fit: cover;
            }

            /* Botón de conectar más accesible al tacto */
            #btn-connect {
                top: 16px;
                left: 16px;
                height: 36px;
                padding: 0 16px;
                font-size: 13px;
                gap: 6px;
                border-radius: 12px;
            }
            #btn-connect svg {
                width: 12px;
                height: 12px;
            }

            /* Indicador de estado más visible */
            #status-badge {
                bottom: 16px;
                font-size: 13px;
                padding: 8px 16px;
            }

            /* Transcripción más legible */
            #transcript-wrap {
                bottom: 48px;
                width: 90vw;
            }
            .transcript-text {
                font-size: 15px;
            }
            .transcript-label {
                font-size: 11px;
                width: 36px;
            }

            /* Panel de depuración móvil */
            #dbg-panel {
                padding-bottom: 20px;
            }
            #dbg-toolbar span {
                font-size: 14px;
            }
            #dbg-clear, #dbg-close {
                padding: 6px 14px;
                font-size: 12px;
            }
            #dbg-mic-row, 
            #dbg-mic-select, 
            #dbg-list {
                font-size: 12px;
            }
        }

        /* ── Burbujas de chat sobrepuestas ── */
        #chat-container {
            position: absolute;
            left: 20px;
            bottom: 140px;
            width: min(350px, 85vw);
            max-height: 40vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 25;
            pointer-events: auto;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.45;
            max-width: 85%;
            word-break: break-word;
            animation: bubble-appear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(24, 24, 27, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f4f4f5;
        }
        .chat-bubble.user {
            align-self: flex-end;
            background: rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.4);
            color: #e0e7ff;
        }
        .chat-bubble.avatar {
            align-self: flex-start;
        }
        .chat-bubble.system {
            align-self: center;
            background: rgba(24, 24, 27, 0.35);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 12px;
            text-align: center;
            font-style: italic;
            box-shadow: none;
            max-width: 90%;
        }
        @keyframes bubble-appear {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-bubble.fade-out {
            animation: bubble-fadeout 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes bubble-fadeout {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-10px) scale(0.95); max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; border-top-width: 0; border-bottom-width: 0; opacity: 0; }
        }



        /* ─── Teclado Numérico Táctil Servipag (RUT / Identificador) ────────────── */
        #btn-floating-numpad {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 55;
            height: 48px;
            padding: 0 20px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(99, 102, 241, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 16px rgba(99, 102, 241, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #e0e7ff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #btn-floating-numpad:hover, #btn-floating-numpad:active {
            transform: scale(1.04);
            border-color: #818cf8;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 24px rgba(99, 102, 241, 0.4);
            color: #ffffff;
        }

        .floating-icon {
            font-size: 18px;
        }

        /* Modal / Overlay del Teclado Numérico */
        #rut-numpad-overlay {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            width: min(360px, calc(100vw - 32px));
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.96);
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #rut-numpad-overlay.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .numpad-card {
            background: rgba(15, 17, 26, 0.94);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            color: #f8fafc;
            user-select: none;
        }

        .numpad-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .numpad-title-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #c7d2fe;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .numpad-close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .numpad-close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .numpad-display-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .numpad-display-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
        }

        .numpad-display-text {
            font-size: 24px;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.06em;
            color: #38bdf8;
            min-height: 34px;
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .numpad-display-text.placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 18px;
            font-weight: 500;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .numpad-key {
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            font-size: 22px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .numpad-key:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .numpad-key:active {
            transform: scale(0.94);
            background: rgba(99, 102, 241, 0.35);
            border-color: #818cf8;
        }

        .numpad-key.key-k {
            color: #38bdf8;
            font-weight: 700;
            font-size: 20px;
        }

        .numpad-key.key-del {
            color: #f87171;
            font-size: 18px;
        }

        .numpad-footer-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .numpad-btn-clear {
            height: 48px;
            padding: 0 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .numpad-btn-clear:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fca5a5;
        }

        .numpad-btn-submit {
            flex: 1;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
            transition: all 0.2s;
        }

        .numpad-btn-submit:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.5);
        }

        .numpad-btn-submit:active:not(:disabled) {
            transform: scale(0.97);
        }

        .numpad-btn-submit:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.5);
            box-shadow: none;
        }
    </style>
</head>

<body class="state-connecting">

    <!-- Elementos requeridos por client.js -->
    <input type="hidden" id="sessionid" value="0">
    <audio id="audio" autoplay></audio>
    <input type="checkbox" id="use-stun" style="display:none">

    <!-- Debug log panel (tap 🪲 to open) -->

    <!-- WebRTC client -->
    <script src="client.js"></script>

    <script>
        // ══════════════════════════════════════════════════════════════════════════════
        // DEBUG LOGGER — escribe en consola del navegador Y en el panel on-screen 🪲
        // ══════════════════════════════════════════════════════════════════════════════
        const _DBG_MAX = 200;

        function _dbgWrite(level, args) {
            if (level === 'log') console.log('[Avatar]', ...args);
            if (level === 'warn') console.warn('[Avatar]', ...args);
            if (level === 'err') console.error('[Avatar]', ...args);

            const list = document.getElementById('dbg-list');
            if (!list) return;

            const now = new Date();
            const ts = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.${String(now.getMilliseconds()).padStart(3, '0')}`;
            const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');

            const entry = document.createElement('div');
            entry.className = `dbg-entry dbg-${level}`;
            entry.innerHTML =
                `<span class="dbg-ts">${ts}</span>` +
                `<span class="dbg-label-${level}">${level.toUpperCase()}</span>` +
                `<span class="dbg-msg">${msg.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`;
            list.appendChild(entry);

            while (list.children.length > _DBG_MAX) list.removeChild(list.firstChild);

            const panel = document.getElementById('dbg-panel');
            if (panel && panel.classList.contains('open')) {
                list.scrollTop = list.scrollHeight;
            }
        }

        const LOG = (...args) => _dbgWrite('log', args);
        const WARN = (...args) => _dbgWrite('warn', args);
        const ERR = (...args) => _dbgWrite('err', args);

        function dbgToggle() {
            const panel = document.getElementById('dbg-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                const list = document.getElementById('dbg-list');
                list.scrollTop = list.scrollHeight;
            }
        }

        function dbgClear() {
            const list = document.getElementById('dbg-list');
            list.innerHTML = '';
            LOG('Consola limpiada');
        }

        // ─── Selector de micrófono en panel debug ─────────────────────────────────
        let _preferredDeviceId = null;

        async function dbgLoadDevices() {
            const sel = document.getElementById('dbg-mic-select');
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                WARN('enumerateDevices no disponible en este dispositivo');
                return;
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                LOG(`Micrófonos disponibles: ${audioInputs.length}`);
                audioInputs.forEach((d, i) => {
                    LOG(`  [${i}] id="${d.deviceId.slice(0, 16)}…" label="${d.label || '(sin permiso)'}"`);
                });

                if (sel) {
                    sel.innerHTML = '<option value="">-- default del sistema --</option>';
                    audioInputs.forEach((d, i) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label
                            ? d.label
                            : `Micrófono ${i + 1}  (${d.deviceId.slice(0, 8)}…)`;
                        if (d.deviceId === _preferredDeviceId) opt.selected = true;
                        sel.appendChild(opt);
                    });
                }

                if (audioInputs.length === 0) ERR('¡No se encontraron micrófonos!');
            } catch (e) {
                ERR('dbgLoadDevices error:', e.name, e.message);
            }
        }

        function dbgSelectMic(deviceId) {
            _preferredDeviceId = deviceId || null;
            if (_preferredDeviceId) {
                const sel = document.getElementById('dbg-mic-select');
                const label = sel?.options[sel.selectedIndex]?.textContent || deviceId;
                LOG(`🎤 Micrófono seleccionado: "${label}"`);
            } else {
                LOG('🎤 Micrófono: default del sistema');
            }
        }

        LOG('=== INIT ===');
        LOG('UA:', navigator.userAgent);
        LOG('Secure context:', window.isSecureContext);
        LOG('SpeechRecognition:', !!(window.SpeechRecognition || window.webkitSpeechRecognition));
        LOG('getUserMedia:', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
        LOG('Protocol:', location.protocol, '| Host:', location.host);

        // ─── Estado ────────────────────────────────────────────────────────────────
        let isConnected = false;
        let isListening = false;
        let recognition = null;
        let isSpeaking = false;
        let speakCheckInterval = null;
        let _audioUnlocked = false;

        // ─── Wake-word & Modo Conversación Abierta (Experimental) ───────────────
        const WAKE_WORDS = ['hola', 'oye', 'disculpa', 'permiso', 'necesito ayuda', 'asistente', 'buenas'];
        const WAKE_WORD = WAKE_WORDS[0];

        let _wakeDetected = false;
        let _alwaysOnActive = false;

        let _conversationAwake = false;  // true si el flujo de conversación está activo sin requerir wake-word
        let _inactivityTimeoutId = null; // temporizador de inactividad
        let _followUpTimeoutId = null;   // ID del temporizador para preguntar si necesita algo más
        let _waitingFollowUpAck = false;  // true cuando se preguntó "¿Necesitas algo más?" y esperamos respuesta
        let _followUpAckTimeoutId = null; // timer del segundo wait de 30s tras "¿Necesitas algo más?"
        let _pendingAvatarBubbleText = null;    // Texto de respuesta del LLM en cola para mostrar cuando empiece a hablar
        let _pendingAvatarBubbleTimeout = null; // Timeout de seguridad para la burbuja en cola
        const INACTIVITY_TIMEOUT_MS = 120000;   // 2 minutos antes de volver a modo de espera

        const BUFFER_MS = 5000;                 // ms de espera para pregunta tras la wake-word
        let _wakeBufferTimeout = null;

        const WAKE_ONLY_GREETINGS = [
            '¡Hola! Bienvenido a Servipag. ¿Qué cuenta deseas pagar hoy: luz, agua, internet, gas o autopista?',
            '¡Hola! ¿Qué servicio o cuenta deseas pagar hoy: luz, agua o internet?',
            '¡Hola! ¿En qué cuenta o servicio te puedo ayudar hoy?',
            'Aquí estoy. ¿Qué cuenta deseas consultar o pagar hoy?'
        ];

        function _randomGreeting() {
            return WAKE_ONLY_GREETINGS[Math.floor(Math.random() * WAKE_ONLY_GREETINGS.length)];
        }

        function _containsWakeWord(text) {
            const lower = text.toLowerCase();
            return WAKE_WORDS.some(w => lower.includes(w));
        }

        function _extractQuestion(text) {
            const lower = text.toLowerCase();
            let best = { idx: -1, word: '' };
            for (const w of WAKE_WORDS) {
                const i = lower.indexOf(w);
                if (i !== -1 && (best.idx === -1 || i < best.idx)) {
                    best = { idx: i, word: w };
                }
            }
            if (best.idx === -1) return text.trim();
            return text.slice(best.idx + best.word.length).replace(/^[,\.\s¿¡]+/, '').trim();
        }

        function _isSleepWord(text) {
            const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?¡!]/g,"").trim();
            // Frases exactas de despedida o cierre negativo
            const exactSleepPhrases = [
                'no', 'no gracias', 'no muchas gracias', 'no por ahora', 'no nada mas',
                'no ya no', 'no seria todo', 'no eso seria todo', 'no eso es todo',
                'no por el momento', 'no de momento', 'no gracias chao',
                'gracias', 'muchas gracias', 'chao', 'adios', 'hasta luego',
                'nada mas', 'ninguna', 'ninguno', 'eso es todo', 'nos vemos',
                'que estes bien', 'chao chao', 'bye', 'seria todo', 'listo gracias'
            ];
            if (exactSleepPhrases.includes(clean)) {
                return true;
            }

            // Prefijos de despedida explícita (NUNCA incluir 'no' aquí para no cortar frases como 'no hay este producto')
            const farewellPrefixes = [
                'chao ', 'adios ', 'hasta luego ', 'nos vemos ', 'bye ', 'muchas gracias ', 'gracias por '
            ];
            if (farewellPrefixes.some(pre => clean.startsWith(pre))) {
                return true;
            }

            return false;
        }

        function clearServerHistory() {
            const sessionid = document.getElementById('sessionid').value;
            LOG('Borrando historial de conversación en servidor para sesión:', sessionid);
            fetch('/clear_history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionid: String(sessionid) })
            }).catch(e => WARN('clearServerHistory error:', e));
        }

        function sleepModel(showBubble = false) {
            LOG("Durmiendo el modelo experimental (conversación cerrada).");
            _conversationAwake = false;
            _wakeDetected = false;
            _waitingFollowUpAck = false;
            clearTimeout(_inactivityTimeoutId);
            clearTimeout(_followUpTimeoutId);
            clearTimeout(_followUpAckTimeoutId);
            clearServerHistory();
            setState('listening', 'Esperando activación…');
            if (showBubble) {
                addChatBubble('system', 'Conversación finalizada. Di "Hola" para activar de nuevo.');
            }
        }

        function wakeUpModel() {
            if (!_conversationAwake) {
                LOG("Despertando el modelo experimental (conversación abierta).");
                _conversationAwake = true;
                const container = document.getElementById('chat-container');
                if (container) container.innerHTML = '';
            }
            resetInactivityTimer();
        }

        function resetInactivityTimer() {
            clearTimeout(_inactivityTimeoutId);
            if (!_conversationAwake) return;
            _inactivityTimeoutId = setTimeout(() => {
                LOG("Sesión inactiva por 2 minutos. Volviendo a modo de espera de wake-word.");
                _conversationAwake = false;
                _wakeDetected = false;
                setState('listening', 'Esperando activación…');
                clearServerHistory();
                const container = document.getElementById('chat-container');
                if (container) container.innerHTML = '';
            }, INACTIVITY_TIMEOUT_MS);
        }

        function normalizarTexto(text) {
            if (!text) return '';
            return text
                .replace(/(\d+)\s*%/g, '$1 por ciento')
                .replace(/\$(\d[\d\.]*)\s*(?:pesos)?/g, '$1 pesos')
                .replace(/[→⇒➜➞➝➔]|->|=>|<-|<=|↔/g, ' ')
                .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')
                .replace(/_{1,3}([^_]+)_{1,3}/g, '$1')
                .replace(/~~([^~]+)~~/g, '$1')
                .replace(/`+([^`]+)`+/g, '$1')
                .replace(/^\s*#{1,6}\s*/gm, '')
                .replace(/[-—–]+/g, ' ')
                .replace(/[*#|_\\/\[\]{}~^<>•·●○■◆▪\(\)]/g, ' ')
                .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]|[\u2300-\u23FF]|[\u2B50-\u2B55]/g, '')
                .replace(/\s+([,.:;?!])/g, '$1')
                .replace(/[,]{2,}/g, ',')
                .replace(/[.]{2,}/g, '.')
                .replace(/\s{2,}/g, ' ')
                .replace(/\b[Rr][Uu][Tt]\b/g, 'rut')
                .trim();
        }

        const SPANISH_NUMS = {
            'cero': 0, 'un': 1, 'uno': 1, 'una': 1,
            'dos': 2, 'tres': 3, 'cuatro': 4, 'cinco': 5,
            'seis': 6, 'siete': 7, 'ocho': 8, 'nueve': 9,
            'diez': 10, 'once': 11, 'doce': 12, 'trece': 13, 'catorce': 14, 'quince': 15,
            'dieciseis': 16, 'dieciséis': 16, 'diecisiete': 17, 'dieciocho': 18, 'diecinueve': 19,
            'veinte': 20, 'veintiuno': 21, 'veintidos': 22, 'veintidós': 22, 'veintitres': 23, 'veintitrés': 23,
            'veinticuatro': 24, 'veinticinco': 25, 'veintiseis': 26, 'veintiséis': 26, 'veintisiete': 27,
            'veintiocho': 28, 'veintinueve': 29,
            'treinta': 30, 'cuarenta': 40, 'cincuenta': 50,
            'sesenta': 60, 'setenta': 70, 'ochenta': 80, 'noventa': 90,
            'cien': 100, 'ciento': 100, 'doscientos': 200, 'trescientos': 300,
            'cuatrocientos': 400, 'quinientos': 500, 'seiscientos': 600,
            'setecientos': 700, 'ochocientos': 800, 'novecientos': 900
        };

        function parseSpokenSpanishNumbers(text) {
            if (!text) return '';
            const tokens = text.match(/[a-zA-ZáéíóúÁÉÍÓÚñÑ]+|\d+|[-]|[,.:;?!¿¡]/g) || [];
            const result = [];
            let i = 0;
            const n = tokens.length;
            while (i < n) {
                const tok = tokens[i];
                const tokLower = tok.toLowerCase();
                if (SPANISH_NUMS[tokLower] !== undefined && SPANISH_NUMS[tokLower] >= 100 && i + 1 < n && SPANISH_NUMS[tokens[i+1].toLowerCase()] !== undefined) {
                    let val = SPANISH_NUMS[tokLower];
                    i++;
                    if (i + 2 < n && SPANISH_NUMS[tokens[i].toLowerCase()] !== undefined && tokens[i+1].toLowerCase() === 'y' && SPANISH_NUMS[tokens[i+2].toLowerCase()] !== undefined) {
                        val += SPANISH_NUMS[tokens[i].toLowerCase()] + SPANISH_NUMS[tokens[i+2].toLowerCase()];
                        i += 3;
                    } else if (SPANISH_NUMS[tokens[i].toLowerCase()] !== undefined) {
                        val += SPANISH_NUMS[tokens[i].toLowerCase()];
                        i++;
                    }
                    result.push(String(val));
                } else if (SPANISH_NUMS[tokLower] !== undefined && i + 2 < n && tokens[i+1].toLowerCase() === 'y' && SPANISH_NUMS[tokens[i+2].toLowerCase()] !== undefined) {
                    const val = SPANISH_NUMS[tokLower] + SPANISH_NUMS[tokens[i+2].toLowerCase()];
                    result.push(String(val));
                    i += 3;
                } else if (SPANISH_NUMS[tokLower] !== undefined) {
                    result.push(String(SPANISH_NUMS[tokLower]));
                    i++;
                } else if (['k', 'ka', 'ca'].includes(tokLower) && (i > 0 && (['guion', 'guión', 'raya', 'menos', '-'].includes(tokens[i-1].toLowerCase()) || (result.length > 0 && (/\d+/.test(result[result.length - 1]) || result[result.length - 1] === '-'))))) {
                    result.push('K');
                    i++;
                } else if (['guion', 'guión', 'raya', 'menos'].includes(tokLower)) {
                    result.push('-');
                    i++;
                } else if (['millon', 'millones', 'mil'].includes(tokLower) && result.length > 0 && /\d+/.test(result[result.length - 1])) {
                    i++;
                } else if (/^\d+$/.test(tok) || tok === '-') {
                    result.push(tok);
                    i++;
                } else {
                    result.push(tok);
                    i++;
                }
            }

            let s = result.join(' ');
            s = s.replace(/\s+([,.:;?!])/g, '$1');
            s = s.replace(/([¿¡])\s+/g, '$1');
            // Colapsar puntos y comas entre dígitos (ej: '12. 345. 678' -> '12345678')
            s = s.replace(/(?<=\d)\s*[\.,]\s*(?=\d)/g, '');
            s = s.replace(/(?<=\d)\s+(?=[\dkK]\b)/gi, '');
            s = s.replace(/\s*-\s*/g, '-');
            s = s.replace(/(?<=\d)\s+(?=\d)/g, '');
            s = s.replace(/(\d+)-([\dkK])\b/gi, '$1-$2');
            return s;
        }

        function normalizeUserInput(text) {
            if (!text) return '';
            let s = text.trim();

            // 1. Normalizar Enel si STT transcribió 'En', 'en el', 'en él', 'ener', 'ene'
            s = s.replace(/^(?:en|en\s+el|en\s+él|ene|ener)$/i, 'Enel');
            s = s.replace(/\b(?:empresa|cuenta|para|de)\s+(?:en\s+el|en\s+él|ener|ene|en)\b/gi, (m) => m.split(/\s+/)[0] + ' Enel');
            s = s.replace(/\b(?:en\s+el|en\s+él|ener|ene)\b/gi, 'Enel');
            s = s.replace(/\ben\s*,\s*/gi, 'Enel, ');
            s = s.replace(/\ben\s+(?=rut|cliente|número|numero|\d)/gi, 'Enel ');

            // 2. Parsear números hablados en palabras españolas a dígitos
            s = parseSpokenSpanishNumbers(s);

            // 3. Colapsar puntos y comas entre dígitos (cuando STT pone pausas tipo '12, 345, 678-5' o '12. 345. 678-5')
            s = s.replace(/(?<=\d)\s*[\.,]\s*(?=\d)/g, '');

            // 4. Normalizar guion y espacios alrededor
            s = s.replace(/\s*(?:-|guion|guión|raya|menos)\s*/gi, '-');

            // 5. Colapsar espacios entre dígitos consecutivos (ej: '1 2 3 4 5 6 7 8 - 5' -> '12345678-5')
            s = s.replace(/(?<=\d)\s+(?=[\dkK]\b)/gi, '');
            s = s.replace(/(?<=\d)\s+(?=\d)/g, '');

            // 6. Asegurar formato RUT con guión
            s = s.replace(/(\d+)-([\dkK])\b/gi, '$1-$2');

            return s;
        }

        function isDictatingRutOrNumber(text) {
            if (_isWaitingRut) return true;
            if (!text) return false;
            const clean = text.toLowerCase();
            // Detecta explícitamente palabras de identificación
            if (/\b(rut|cliente|cuenta|numero|número|identificador)\b/i.test(clean)) return true;
            // Si contiene dígitos
            if (/\d/.test(clean)) return true;
            // Palabras de números dictados en español (incluso una sola palabra como 'doce', 'treinta', 'dos', 'once')
            if (/\b(uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|cero|diez|once|doce|trece|catorce|quince|dieciseis|dieciséis|diecisiete|dieciocho|diecinueve|veinte|veintiuno|veintidos|veintidós|veintitres|veintitrés|veinticuatro|veinticinco|veintiseis|veintiséis|veintisiete|veintiocho|veintinueve|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|quinientos|mil|millon|millones|guion|guión|raya|menos|k|ka)\b/i.test(clean)) {
                return true;
            }
            return false;
        }

        function hasCompleteRut(text) {
            if (!text) return false;
            const norm = normalizeUserInput(text);
            return /\b\d{7,8}-?[\dkK]\b/.test(norm);
        }

        function addChatBubble(role, text) {
            const container = document.getElementById('chat-container');
            if (!container) return;

            const cleanText = (role === 'avatar') ? normalizarTexto(text) : text;

            // Evitar duplicar burbujas de sistema consecutivas idénticas
            if (role === 'system' && container.lastElementChild && container.lastElementChild.textContent.trim() === text.trim()) {
                return container.lastElementChild;
            }

            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role}`;
            bubble.textContent = cleanText;
            container.appendChild(bubble);

            container.scrollTop = container.scrollHeight;

            while (container.children.length > 5) {
                container.removeChild(container.firstChild);
            }

            setTimeout(() => {
                bubble.classList.add('fade-out');
                setTimeout(() => {
                    if (bubble.parentNode) {
                        bubble.parentNode.removeChild(bubble);
                    }
                }, 500);
            }, 30000);

            return bubble;
        }

        function queueAvatarBubble(text) {
            clearTimeout(_pendingAvatarBubbleTimeout);
            _pendingAvatarBubbleText = text;
            
            if (isSpeaking) {
                addChatBubble('avatar', _pendingAvatarBubbleText);
                _pendingAvatarBubbleText = null;
                return;
            }
            
            _pendingAvatarBubbleTimeout = setTimeout(() => {
                if (_pendingAvatarBubbleText) {
                    addChatBubble('avatar', _pendingAvatarBubbleText);
                    _pendingAvatarBubbleText = null;
                }
            }, 4000);
        }

        function scheduleFollowUp() {
            // Si ya preguntamos "¿Necesitas algo más?" y esperamos respuesta,
            // NO reprogramar — evita el bucle infinito de preguntas
            if (_waitingFollowUpAck) {
                LOG('scheduleFollowUp: ya esperando ACK del follow-up, no reprogramar.');
                return;
            }
            clearTimeout(_followUpTimeoutId);
            clearTimeout(_followUpAckTimeoutId);
            if (!_conversationAwake) return;
            _followUpTimeoutId = setTimeout(() => {
                LOG("15 segundos de silencio → Preguntando si necesita algo más.");
                const followUpText = "¿Necesitas algo más?";
                _waitingFollowUpAck = true;
                
                queueAvatarBubble(followUpText);
                stopAlwaysOnListening();
                
                const sessionid = document.getElementById('sessionid').value;
                fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: followUpText,
                        type: 'echo',
                        sessionid: String(sessionid)
                    })
                }).catch(e => WARN('Error al enviar follow-up:', e));
            }, 15000);
        }

        function scheduleFollowUpAckTimeout() {
            clearTimeout(_followUpAckTimeoutId);
            if (!_waitingFollowUpAck || !_conversationAwake) return;
            LOG('scheduleFollowUpAckTimeout: esperando 15s respuesta al follow-up…');
            _followUpAckTimeoutId = setTimeout(() => {
                if (!_waitingFollowUpAck) return;
                LOG('15s sin respuesta al follow-up → enviando despedida final y durmiendo.');
                _waitingFollowUpAck = false;
                const farewellText = "Muy bien, si necesitas algo más no dudes en llamarme. ¡Que tengas un excelente día!";
                queueAvatarBubble(farewellText);
                stopAlwaysOnListening();
                clearServerHistory();
                _conversationAwake = false;
                _wakeDetected = false;
                clearTimeout(_inactivityTimeoutId);
                clearTimeout(_followUpTimeoutId);
                const sessionid = document.getElementById('sessionid').value;

                    headers: { 'Content-Type': 'application/json' },

                        sessionid: String(sessionid)
                    })
                }).then(() => {

        // ─── Teclado Numérico Touch en Pantalla para RUT (Servipag) ──────────────
        let _rutBuffer = '';
        let _pendingRutNumpadShow = false;
        let _isRutError = false;
        let _isWaitingRut = false;
        let _lastAvatarMessage = '';

        function formatRutDisplay(raw) {
            if (!raw) return '';
            const clean = raw.replace(/[^0-9kK]/g, '').toUpperCase();
            if (clean.length <= 1) return clean;
            if (clean.length >= 8) {
                const body = clean.slice(0, -1);
                const dv = clean.slice(-1);
                const formattedBody = body.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                return `${formattedBody}-${dv}`;
            }
            return clean.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function updateNumpadDisplay() {
            const displayEl = document.getElementById('numpad-display');
            const submitBtn = document.getElementById('numpad-btn-submit');
            if (!displayEl) return;

            if (!_rutBuffer) {
                displayEl.textContent = 'Ej: 12.345.678-5';
                displayEl.classList.add('placeholder');
                if (submitBtn) submitBtn.disabled = true;
            } else {
                displayEl.textContent = formatRutDisplay(_rutBuffer);
                displayEl.classList.remove('placeholder');
                if (submitBtn) {
                    submitBtn.disabled = (_rutBuffer.length < 7);
                }
            }
        }

        function numpadPress(char) {
            if (_rutBuffer.length >= 9) return;
            const upper = String(char).toUpperCase();
            if (upper === 'K') {
                if (_rutBuffer.length < 6 || _rutBuffer.includes('K')) return;
                _rutBuffer += 'K';
            } else if (/^\d$/.test(upper)) {
                if (_rutBuffer.includes('K')) return;
                _rutBuffer += upper;
            }
            updateNumpadDisplay();
        }

        function numpadBackspace() {
            if (_rutBuffer.length > 0) {
                _rutBuffer = _rutBuffer.slice(0, -1);
                updateNumpadDisplay();
            }
        }

        function numpadClear() {
            _rutBuffer = '';
            updateNumpadDisplay();
        }

        function showRutNumpad(clear = false) {
            const overlay = document.getElementById('rut-numpad-overlay');
            if (!overlay) return;
            if (clear) {
                _rutBuffer = '';
            }
            updateNumpadDisplay();
            overlay.classList.add('open');
            LOG('showRutNumpad: Teclado numérico abierto en pantalla');
        }

        function hideRutNumpad() {
            const overlay = document.getElementById('rut-numpad-overlay');
            if (overlay) {
                overlay.classList.remove('open');
                LOG('hideRutNumpad: Teclado numérico cerrado');
            }
        }

        function toggleRutNumpad() {
            const overlay = document.getElementById('rut-numpad-overlay');
            if (!overlay) return;
            if (overlay.classList.contains('open')) {
                hideRutNumpad();
            } else {
                showRutNumpad(false);
            }
        }

        async function numpadSubmit() {
            if (_rutBuffer.length < 7) return;
            const finalRut = formatRutDisplay(_rutBuffer);
            LOG(`numpadSubmit: RUT ingresado desde teclado táctil: "${finalRut}"`);

            // Ocultar teclado inmediatamente tras digitar
            hideRutNumpad();

            // Detener escucha activa para que el mic no capture ruido en la transición
            stopAlwaysOnListening();

            // Despertar modelo / conversación
            wakeUpModel();

            // Enviar el RUT al LLM
            await sendToLLM(finalRut);
        }

        function toggleFullscreen() {

            const el = document.documentElement;
            if (!document.fullscreenElement &&
                !document.webkitFullscreenElement &&
                !document.mozFullScreenElement) {
                const req = el.requestFullscreen
                    || el.webkitRequestFullscreen

        // ─── Tap-to-start (Android autoplay fix) ──────────────────────────────────
        function handleTapToStart() {
            LOG('handleTapToStart — tap del usuario detectado');
            const overlay = document.getElementById('tap-overlay');
            if (overlay) overlay.style.display = 'none';

            const videoEl = document.getElementById('video');
            videoEl.muted = false;
            _audioUnlocked = true;
            LOG('Video desmutado dentro del gesto de usuario');

            if (videoEl.srcObject) {
                videoEl.play()
                    .then(() => LOG('video.play() OK tras tap'))
                    .catch(e => WARN('video.play() rechazado tras tap:', e.name, e.message));

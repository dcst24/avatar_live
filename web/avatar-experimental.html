        // ─── Pantalla completa ─────────────────────────────────────────────────────
        function toggleFullscreen() {
            LOG('toggleFullscreen llamado');
            const el = document.documentElement;
            if (!document.fullscreenElement &&
                !document.webkitFullscreenElement &&
                !document.mozFullScreenElement) {
                const req = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.mozRequestFullScreen
                    || el.msRequestFullscreen;
                if (req) req.call(el).catch(e => WARN('Fullscreen error:', e));
            } else {
                const exit = document.exitFullscreen
                    || document.webkitExitFullscreen
                    || document.mozCancelFullScreen
                    || document.msExitFullscreen;
                if (exit) exit.call(document);
            }
        }

        // ─── Tap-to-start (Android autoplay fix) ──────────────────────────────────
        function handleTapToStart() {
            LOG('handleTapToStart — tap del usuario detectado');
            const overlay = document.getElementById('tap-overlay');
            if (overlay) overlay.style.display = 'none';

            const videoEl = document.getElementById('video');
            videoEl.muted = false;
            _audioUnlocked = true;
            LOG('Video desmutado dentro del gesto de usuario');

            if (videoEl.srcObject) {
                videoEl.play()
                    .then(() => LOG('video.play() OK tras tap'))
                    .catch(e => WARN('video.play() rechazado tras tap:', e.name, e.message));
            }

            connectRTC();
        }

        // ─── WebRTC ────────────────────────────────────────────────────────────────
        function connectRTC() {
            if (isConnected) { LOG('connectRTC: ya conectado, ignorando'); return; }
            LOG('connectRTC: iniciando...');
            setState('connecting', 'Conectando…');
            start();   // client.js
            document.getElementById('btn-connect').textContent = '✓ Conectado';
            document.getElementById('btn-connect').classList.add('connected');
            isConnected = true;

            const _v = document.getElementById('video');
            let _vChecks = 0;
            const _vTimer = setInterval(function () {
                _vChecks++;
                if (_v.srcObject) {
                    if (_v.paused) {
                        if (_audioUnlocked) {
                            _v.muted = false;
                            _v.play()
                                .then(function () { LOG('video.play() OK con audio'); clearInterval(_vTimer); })
                                .catch(function () {
                                    WARN('video.play() rechazó audio, fallback a muted');
                                    _v.muted = true;
                                    _audioUnlocked = false;
                                    _v.play()
                                        .then(function () { LOG('video.play() OK muted (fallback)'); clearInterval(_vTimer); })
                                        .catch(function (e) { WARN('video.play() muted fallo:', e.name); clearInterval(_vTimer); });
                                });
                        } else {
                            // Intentar reproducir directamente con audio si la política de autoplay lo permite
                            _v.muted = false;
                            _v.play()
                                .then(function () {
                                    _audioUnlocked = true;
                                    LOG('video.play() OK con audio directo (autoplay habilitado)');
                                    clearInterval(_vTimer);
                                })
                                .catch(function () {
                                    _v.muted = true;
                                    _v.play()
                                        .then(function () { LOG('video.play() OK muted (esperando interacción)'); clearInterval(_vTimer); })
                                        .catch(function (e) { WARN('video.play() muted fallo:', e.name); clearInterval(_vTimer); });
                                });
                        }
                    } else {
                        LOG('Video reproduciendo');
                        clearInterval(_vTimer);
                    }
                } else if (_vChecks > 30) {
                    WARN('15s sin stream en el video.');
                    clearInterval(_vTimer);
                }
            }, 500);
            setTimeout(() => {
                startSpeakingMonitor();
                LOG('Monitor de speaking activo — iniciando always-on listening');
                startAlwaysOnListening();
            }, 2500);
        }

        // ─── Monitor de "avatar hablando" ──────────────────────────────────────────
        // Watchdog: si el avatar lleva más de MAX_SPEAKING_MS en estado "hablando"
        // sin que el backend reporte speaking=false (latencia / corte de red), lo resetea forzosamente.
        const MAX_SPEAKING_MS = 35000;
        let _speakingWatchdog = null;

        function _clearSpeakingWatchdog() {
            clearTimeout(_speakingWatchdog);
            _speakingWatchdog = null;
        }

        function _armSpeakingWatchdog() {
            _clearSpeakingWatchdog();
            _speakingWatchdog = setTimeout(() => {
                if (isSpeaking) {
                    WARN('[Speaking Watchdog] Avatar en estado "hablando" por más de ' + (MAX_SPEAKING_MS / 1000) + 's sin fin reportado. Forzando reset.');
                    isSpeaking = false;
                    const wrap = document.getElementById('avatar-wrap');
                    if (wrap) wrap.classList.remove('avatar-speaking');
                    setState('ready', 'Preparando micrófono…');
                    if (_conversationAwake) {
                        scheduleFollowUp();
                    }
                    setTimeout(() => {
                        if (!isListening && isConnected) {
                            _alwaysOnActive = false;
                            startAlwaysOnListening();
                        }
                    }, 80);
                }
            }, MAX_SPEAKING_MS);
        }

        let _speakingMonitorTimer = null;

        function startSpeakingMonitor() {
            LOG('startSpeakingMonitor iniciado');
            const checkSpeaking = async () => {
                if (!isConnected) {
                    _speakingMonitorTimer = setTimeout(checkSpeaking, 400);
                    return;
                }
                try {
                    const sessionid = document.getElementById('sessionid').value;
                    const res = await fetch('/is_speaking', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionid })
                    });
                    const data = await res.json();
                    const speaking = data.data;
                    if (speaking !== isSpeaking) {
                        isSpeaking = speaking;
                        LOG('isSpeaking cambió →', speaking);
                        const wrap = document.getElementById('avatar-wrap');
                        if (speaking) {
                            if (wrap) wrap.classList.add('avatar-speaking');
                            setState('speaking', 'Hablando…');
                            _armSpeakingWatchdog();
                            // Pausar reconocimiento de inmediato para evitar eco acústico
                            if (isListening || _alwaysOnActive) {
                                LOG('[Speaking Monitor] Avatar comenzó a hablar → pausando micrófono');
                                stopAlwaysOnListening();
                            }
                            if (_pendingAvatarBubbleText) {
                                clearTimeout(_pendingAvatarBubbleTimeout);
                                addChatBubble('avatar', _pendingAvatarBubbleText);
                                _pendingAvatarBubbleText = null;
                            }
                        } else {
                            if (wrap) wrap.classList.remove('avatar-speaking');
                            _clearSpeakingWatchdog();
                            LOG('Avatar terminó de hablar → preparando escucha (awake: ' + _conversationAwake + ')');
                            
                            // Estado intermedio sincronizado: NO decir "Escuchando" hasta que el mic esté abierto
                            setState('ready', 'Preparando micrófono…');
                            if (_conversationAwake) {
                                if (_waitingFollowUpAck) {
                                    scheduleFollowUpAckTimeout();
                                } else {
                                    scheduleFollowUp();
                                }
                            }

                            // Activación inmediata del micrófono con guardia acústica mínima (50ms)
                            setTimeout(() => {
                                if (!isListening && isConnected && !isSpeaking) {
                                    _alwaysOnActive = false;
                                    startAlwaysOnListening();
                                }
                            }, 50);
                        }
                    }
                } catch (e) {
                    WARN('[Speaking Monitor] Error al consultar is_speaking:', e.message || e);
                }
                // Sondeo adaptativo de alta frecuencia: 150ms durante habla para corte instantáneo, 200ms en reposo
                const nextInterval = isSpeaking ? 150 : 200;
                _speakingMonitorTimer = setTimeout(checkSpeaking, nextInterval);
            };

            clearTimeout(_speakingMonitorTimer);
            checkSpeaking();
        }

        // ─── Solicitud de Permiso de Micrófono ────────────────────────────────────
        let _micPermissionGranted = false;

        async function requestMicPermission() {
            LOG('requestMicPermission: verificando micrófono...');
            if (_preferredDeviceId) LOG(`Usando dispositivo seleccionado: ${_preferredDeviceId.slice(0, 16)}…`);
            try {
                const audioConstraints = _preferredDeviceId
                    ? { deviceId: { exact: _preferredDeviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    : { echoCancellation: true, noiseSuppression: true, autoGainControl: true };

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: audioConstraints,
                    video: false
                });

                const tracks = stream.getAudioTracks();
                tracks.forEach((t, i) => {
                    LOG(`  Track[${i}]: label="${t.label}" readyState=${t.readyState}`);
                    t.stop(); // Liberar track para no bloquear SpeechRecognition
                });

                _micPermissionGranted = true;
                await dbgLoadDevices();

                LOG('Permiso de micrófono OK — Hardware libre para SpeechRecognition');
                return true;
            } catch (e) {
                _micPermissionGranted = false;
                ERR('requestMicPermission falló:', e.name, e.message);
                if (e.name === 'NotAllowedError') {
                    setState('ready', '⚠ Permiso de micrófono denegado');
                } else if (e.name === 'NotFoundError') {
                    setState('ready', '⚠ No se encontró micrófono');
                } else {
                    setState('ready', '⚠ Error de micrófono: ' + e.name);
                }
                return false;
            }
        }

        // ─── Speech Recognition ────────────────────────────────────────────────────
        let _recStartMs = 0;
        let _gotAnyResult = false;
        let _audioCaptureErrors = 0;
        let _networkSpeechErrors = 0;

        function setupRecognition() {
            LOG('setupRecognition: creando instancia...');
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                ERR('SpeechRecognition NO disponible en este navegador');
                return null;
            }

            const rec = new SpeechRec();
            rec.lang = 'es-CL';
            rec.interimResults = true;
            rec.continuous = true;   // <-- true: el navegador no corta en pausas cortas; nuestros timers de debounce controlan el corte
            rec.maxAlternatives = 1;

            let _pendingCommitTimeout = null;
            let _lastInterimText = '';
            let _questionDispatched = false;

            const _dispatchQuestion = (rawText) => {
                if (_questionDispatched) return;
                _questionDispatched = true;
                clearTimeout(_pendingCommitTimeout);
                _lastInterimText = '';

                let question = _extractQuestion(rawText);
                if (!question && _containsWakeWord(rawText)) {
                    clearTimeout(_wakeBufferTimeout);
                    _alwaysOnActive = false;
                    sendGreetingAsAvatar();
                    return;
                } else if (!question) {
                    question = rawText.trim();
                }

                LOG(`Texto procesado para enviar: "${question}" | awake: ${_conversationAwake}`);

                if (question) {
                    clearTimeout(_wakeBufferTimeout);

                    if (_isSleepWord(question)) {
                        LOG(`Palabra de despedida detectada: "${question}" → durmiendo modelo`);
                        sendToLLM(question, true);
                        sleepModel(false);
                        return;
                    }

                    LOG(`Enviando al LLM: "${question}"`);
                    _alwaysOnActive = false;
                    sendToLLM(question);
                }
            };

            rec.onstart = () => {
                _recStartMs = Date.now();
                _gotAnyResult = false;
                _lastInterimText = '';
                _questionDispatched = false;
                clearTimeout(_pendingCommitTimeout);
                LOG(`SpeechRecognition.onstart — ESCUCHANDO (awake: ${_conversationAwake})`);
                isListening = true;
                setState('listening', _conversationAwake ? 'Escuchando pregunta…' : 'Esperando activación…');
                setUserText('', false);
            };

            rec.onresult = (event) => {
                // Protección absoluta anti-eco: si el avatar está hablando, ignorar cualquier captura del micrófono
                if (isSpeaking) {
                    LOG('[rec.onresult] Descartando audio captado mientras el avatar habla (prevención de eco/auto-corte)');
                    return;
                }

                _gotAnyResult = true;
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const t = event.results[i][0].transcript;
                    const conf = event.results[i][0].confidence;
                    if (event.results[i].isFinal) {
                        LOG(`Resultado FINAL: "${t}" (confidence=${conf.toFixed(2)})`);
                        final += t;
                    } else {
                        interim += t;
                    }
                }
                if (interim) LOG(`Resultado interim: "${interim}"`);

                const rawText = (final || interim).trim();
                if (!rawText) return;

                if (!_conversationAwake) {
                    if (_containsWakeWord(rawText)) {
                        wakeUpModel();
                        LOG(`Wake-word detectada en: "${rawText}" → Modelo despierto`);
                        setState('listening', 'Escuchando pregunta…');
                        clearTimeout(_wakeBufferTimeout);
                        _wakeBufferTimeout = setTimeout(() => {
                            if (_conversationAwake && !_extractQuestion(rawText)) {
                                LOG('Buffer expirado sin pregunta → saludo directo del avatar');
                                sendGreetingAsAvatar();
                            }
                        }, BUFFER_MS);
                    } else {
                        setUserText(final || interim, true);
                        return;
                    }
                } else {
                    resetInactivityTimer();
                    clearTimeout(_followUpTimeoutId);
                    clearTimeout(_followUpAckTimeoutId);
                    _waitingFollowUpAck = false;
                }

                setUserText(final || interim, !final);

                if (final) {
                    clearTimeout(_pendingCommitTimeout);
                    _dispatchQuestion(final);
                } else if (_conversationAwake && interim && !_questionDispatched) {
                    _lastInterimText = interim.trim();
                    clearTimeout(_pendingCommitTimeout);

                    const tokens = _lastInterimText.toLowerCase().split(/\s+/);
                    const words = tokens.length;
                    const lastWord = tokens[tokens.length - 1];
                    const connectors = [
                        'de', 'del', 'en', 'el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas',
                        'para', 'por', 'con', 'sin', 'sobre', 'y', 'e', 'o', 'u', 'que', 'a', 'al',
                        'mi', 'su', 'este', 'esta', 'estos', 'estas', 'es', 'son', 'hay', 'tiene', 'tienen'
                    ];
                    const isConnector = connectors.includes(lastWord);
                    // Calibración natural de pausas de voz:
                    // Frases cortas (1-2 palabras): 850ms
                    // Frases medias (3-5 palabras): 1150ms
                    // Frases largas (6+ palabras): 1400ms
                    let delayMs = (words <= 2) ? 850 : ((words <= 5) ? 1150 : 1400);
                    if (isConnector) delayMs += 700; // Dar más margen si el usuario terminó en conector

                    _pendingCommitTimeout = setTimeout(() => {
                        if (_conversationAwake && _lastInterimText && !_questionDispatched) {
                            LOG(`[Interim Auto-Commit] Silencio detectado tras "${_lastInterimText}" (${delayMs}ms) → enviando`);
                            const txt = _lastInterimText;
                            try { rec.stop(); } catch (e) {}
                            _dispatchQuestion(txt);
                        }
                    }, delayMs);
                }
            };

            rec.onerror = (e) => {
                const elapsed = Date.now() - _recStartMs;
                ERR(`SpeechRecognition.onerror — error="${e.error}" elapsed=${elapsed}ms`);

                if (e.error === 'aborted') {
                    LOG('SpeechRecognition abortado programáticamente (pausa normal de micro)');
                    stopListening();
                    return;
                }
                if (e.error === 'no-speech') {
                    LOG('no-speech: timeout normal sin voz');
                    stopListening();
                    return;
                }
                if (e.error === 'audio-capture') {
                    _audioCaptureErrors++;
                    ERR(`audio-capture #${_audioCaptureErrors}: mic no accesible`);
                    setState('ready', '⚠ Error captura de audio — intenta de nuevo');
                } else if (e.error === 'not-allowed') {
                    ERR('not-allowed: permiso de micrófono denegado');
                    setState('ready', '⚠ Permiso de micrófono denegado');
                } else if (e.error === 'network') {
                    _networkSpeechErrors++;
                    ERR('network error #' + _networkSpeechErrors + ': SpeechRecognition no puede conectar a los servidores de voz.');
                    setState('ready', 'Error de red STT — reintenta o verifica soporte de voz');
                } else {
                    setState('ready', `⚠ Error: ${e.error}`);
                }
                stopListening();
            };

            rec.onend = () => {
                const elapsed = Date.now() - _recStartMs;
                LOG(`SpeechRecognition.onend — elapsed=${elapsed}ms, gotResult=${_gotAnyResult}, alwaysOn=${_alwaysOnActive}`);
                clearTimeout(_pendingCommitTimeout);

                if (_conversationAwake && _lastInterimText && !_questionDispatched) {
                    LOG(`[onend Auto-Commit] Texto pendiente en buffer: "${_lastInterimText}" → enviando`);
                    const txt = _lastInterimText;
                    _dispatchQuestion(txt);
                    stopListening();
                    return;
                }

                if (!_gotAnyResult && elapsed < 1500) {
                    WARN(`Fin rápido sin resultado (${elapsed}ms) → reintentando en 300ms`);
                    stopListening();
                    setTimeout(() => {
                        if (!isListening && _alwaysOnActive && !isSpeaking) {
                            LOG('Reintento de SpeechRecognition (always-on)...');
                            startAlwaysOnListening();
                        }
                    }, 300);
                    return;
                }

                stopListening();

                if (_alwaysOnActive && !isSpeaking) {
                    LOG('SpeechRecognition onend: always-on activo → reiniciando en 250ms');
                    setTimeout(() => {
                        if (_alwaysOnActive && !isListening && !isSpeaking) {
                            startAlwaysOnListening();
                        }
                    }, 250);
                }
            };

            return rec;
        }

        let _stopTimeout = null;
        function forceStopRecognition() {
            if (!recognition) { stopListening(); return; }
            LOG('forceStopRecognition: llamando stop()...');
            recognition.stop();

            clearTimeout(_stopTimeout);
            _stopTimeout = setTimeout(() => {
                if (isListening) {
                    WARN('forceStopRecognition: onend no disparó en 2.5s → abort() forzado');
                    try { recognition.abort(); } catch (e) { LOG('abort() excepción (ignorada):', e.name); }
                    stopListening();
                }
            }, 2500);
        }

        function stopListening() {
            LOG('stopListening');
            isListening = false;
            clearTimeout(_stopTimeout);

            if (!isSpeaking && !_alwaysOnActive && _conversationAwake) {
                setState('thinking', 'Pensando…');
            }
        }

        // ─── Escucha siempre activa con wake-word ────────────────────────────────
        function startAlwaysOnListening() {
            if (!isConnected) {
                LOG('startAlwaysOnListening: avatar no conectado, ignorando');
                return;
            }
            if (isSpeaking) {
                LOG('startAlwaysOnListening: avatar hablando, esperando a que termine');
                return;
            }
            if (isListening) {
                LOG('startAlwaysOnListening: ya escuchando, ignorando');
                return;
            }

            _alwaysOnActive = true;
            LOG(`startAlwaysOnListening: iniciando escucha continua (awake: ${_conversationAwake})`);

            // Transición suave: estado 'ready' hasta que rec.onstart confirme hardware activo
            setState('ready', _conversationAwake ? 'Preparando micrófono…' : 'Esperando activación…');
            if (_conversationAwake) {
                resetInactivityTimer();
            }

            const launchRecognition = () => {
                if (!isConnected || isSpeaking) {
                    LOG('launchRecognition: abortado (desconectado o avatar hablando)');
                    return;
                }
                LOG('startAlwaysOnListening: modo SpeechRecognition (always-on)');
                _audioCaptureErrors = 0;
                _networkSpeechErrors = 0;
                recognition = setupRecognition();
                if (recognition) {
                    try {
                        recognition.start();
                        LOG('recognition.start() llamado (always-on)');
                    } catch (e) {
                        ERR('recognition.start() excepción (always-on):', e.name, e.message);
                        _alwaysOnActive = false;
                        stopListening();
                    }
                } else {
                    WARN('SpeechRecognition no disponible en este navegador');
                    _alwaysOnActive = false;
                    setState('ready', '⚠ SpeechRecognition no disponible');
                }
            };

            // Si el permiso ya fue concedido previamente, evitamos llamar getUserMedia()
            // en cada ciclo de habla, ahorrando 300-500ms de latencia y evitando bloqueos de audio
            if (_micPermissionGranted) {
                launchRecognition();
            } else {
                requestMicPermission().then(ok => {
                    if (!ok) {
                        LOG('startAlwaysOnListening: sin permiso de micrófono');
                        _alwaysOnActive = false;
                        setState('ready', '⚠ Sin permiso de micrófono');
                        return;
                    }

                    if (!_audioUnlocked) {
                        const videoEl = document.getElementById('video');
                        videoEl.muted = false;
                        _audioUnlocked = true;
                        if (videoEl.srcObject) {
                            videoEl.play().catch(e => WARN('play() audio unlock error:', e.name));
                        }
                        LOG('🔊 Audio del avatar desbloqueado al obtener permiso de micrófono');
                    }

                    launchRecognition();
                });
            }
        }

        function stopAlwaysOnListening() {
            LOG('stopAlwaysOnListening: deteniendo escucha continua');
            _alwaysOnActive = false;
            clearTimeout(_wakeBufferTimeout);
            if (recognition) {
                try { recognition.abort(); } catch (e) { LOG('abort() excepción (ignorada):', e.name); }
            }
            stopListening();
        }

        // ─── Saludo del avatar al detectar wake-word sin pregunta ────────────────
        async function sendGreetingAsAvatar() {
            stopAlwaysOnListening();
            const greetingText = _randomGreeting();
            LOG(`sendGreetingAsAvatar: "${greetingText}"`);
            setState('thinking', 'Pensando…');
            queueAvatarBubble(greetingText);

            const sessionid = document.getElementById('sessionid').value;
            try {
                await fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: greetingText,
                        type: 'echo',
                        sessionid: String(sessionid)
                    })
                });
            } catch (err) {
                ERR('sendGreetingAsAvatar: error de red:', err);
            }
        }

        // ─── Enviar al LLM / backend (con streaming y burbujas) ─────────────────
        async function sendToLLM(text, isSleepWord = false) {
            if (!text) return;
            stopAlwaysOnListening();
            LOG(`sendToLLM: "${text}" (isSleepWord=${isSleepWord})`);
            setState('thinking', 'Pensando…');
            setUserText(text, false);
            addChatBubble('user', text);

            const sessionid = document.getElementById('sessionid').value;

            if (isSleepWord) {
                closeStoreMap();
                const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?¡!]/g,"");
                let farewellText = "De acuerdo. Si necesitas algo más, aquí estaré.";
                if (clean.includes('gracias') || clean.includes('chao') || clean.includes('adios') || clean.includes('luego')) {
                    farewellText = "De nada. ¡Que tengas un excelente día!";
                }

                queueAvatarBubble(farewellText);
                clearServerHistory();
                _conversationAwake = false;
                _wakeDetected = false;
                _waitingFollowUpAck = false;
                clearTimeout(_inactivityTimeoutId);
                clearTimeout(_followUpTimeoutId);
                clearTimeout(_followUpAckTimeoutId);

                try {
                    await fetch('/human', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: farewellText,
                            type: 'echo',
                            sessionid: String(sessionid)
                        })
                    });
                } catch (err) {
                    ERR('sendToLLM farewell error:', err);
                } finally {
                    addChatBubble('system', 'Conversación finalizada. Di "Hola" para activar de nuevo.');
                    setState('ready', 'Esperando activación…');
                }
                return;
            }

            try {
                if (_activeLLMAbortController) {
                    try { _activeLLMAbortController.abort(); } catch (e) {}
                }
                _activeLLMAbortController = new AbortController();

                const res = await fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        type: 'chat',
                        interrupt: true,
                        stream: true,
                        sessionid: String(sessionid)
                    }),
                    signal: _activeLLMAbortController.signal
                });
                LOG('sendToLLM: respuesta status', res.status);
                
                if (!res.body) {
                    throw new Error("Respuesta del servidor no soporta streaming.");
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = '';
                let avatarBubble = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;

                    if (!avatarBubble && fullText.trim()) {
                        avatarBubble = addChatBubble('avatar', '');
                    }

                    if (avatarBubble) {
                        avatarBubble.textContent = normalizarTexto(fullText);
                        const container = document.getElementById('chat-container');
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    }
                }
                if (avatarBubble) {
                    avatarBubble.textContent = normalizarTexto(fullText);
                }

                LOG('sendToLLM: stream de respuesta del LLM completado:', fullText);

                // Detección automática de ubicación para abrir el mapa interactivo
                checkLocationIntentAndTriggerMap(text + ' ' + fullText);

            } catch (err) {
                if (err && err.name === 'AbortError') {
                    LOG('sendToLLM: streaming cancelado por STOP/interrupción');
                    return;
                }
                ERR('sendToLLM: error de red o streaming:', err);
                setState('ready', 'Error de red — intenta de nuevo');
            } finally {
                _activeLLMAbortController = null;
            }
        }

        // ─── Botón STOP / Interrumpir Avatar ────────────────────────────────────────
        let _activeLLMAbortController = null;

        async function stopAvatarTalking() {
            LOG('stopAvatarTalking: interrumpiendo avatar inmediatamente');

            // 1. Abortar cualquier petición o streaming activo del LLM
            if (_activeLLMAbortController) {
                try {
                    _activeLLMAbortController.abort();
                    LOG('stopAvatarTalking: LLM stream abortado');
                } catch (e) {}
                _activeLLMAbortController = null;
            }

            // 2. Limpiar timers de watchdog y burbujas pendientes
            _clearSpeakingWatchdog();
            clearTimeout(_pendingAvatarBubbleTimeout);
            _pendingAvatarBubbleText = null;

            // 3. Forzar inmediatamente estado visual a reposo y silenciar el audio remanente de los altavoces
            isSpeaking = false;
            const wrap = document.getElementById('avatar-wrap');
            if (wrap) wrap.classList.remove('avatar-speaking');

            // Silenciar temporalmente el elemento de video para cortar el audio residual de los parlantes al instante
            const videoEl = document.getElementById('video');
            if (videoEl && _audioUnlocked) {
                videoEl.muted = true;
                setTimeout(() => {
                    if (videoEl && _audioUnlocked) videoEl.muted = false;
                }, 150);
            }

            // Asegurar que el micrófono esté detenido de inmediato
            stopAlwaysOnListening();

            // 4. Notificar al backend para purgar todas las colas de audio, video y LLM
            const sessionid = document.getElementById('sessionid').value;
            try {
                fetch('/interrupt_talk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionid: String(sessionid) })
                }).catch(e => WARN('stopAvatarTalking error en /interrupt_talk:', e));
            } catch (e) {
                WARN('stopAvatarTalking excepción:', e);
            }

            // 5. Dar paso inmediato al usuario para hablar
            LOG('stopAvatarTalking: activando escucha para el usuario');
            setState('ready', 'Preparando micrófono…');
            if (_conversationAwake) {
                scheduleFollowUp();
            }

            // Pausa acústica mínima (150ms) para que el audio corte en seco antes de abrir el micrófono
            setTimeout(() => {
                if (!isListening && isConnected && !isSpeaking) {
                    _alwaysOnActive = false;
                    startAlwaysOnListening();
                }
            }, 150);
        }

        function openStoreMap(targetPiso = null, targetX = null, targetY = null, title = null, pasillo = null, sector = null) {
            const modal = document.getElementById('store-map-modal');
            if (!modal) return;

            clearTimeout(_autoStepTimer);
            LOG(`openStoreMap: targetPiso=${targetPiso}, title="${title}"`);

            if (targetPiso) {
                _currentMapTarget = {
                    piso: Number(targetPiso),
                    x: Number(targetX || 500),
                    y: Number(targetY || 300),
                    name: title || 'Destino seleccionado',
                    pasillo: pasillo || '',
                    sector: sector || ''
                };
            } else {
                _currentMapTarget = null;
            }

            // Configurar vistas según si es multi-piso o mismo piso
            if (_currentMapTarget && _currentMapTarget.piso > 1) {
                // Destino en Piso 2 o 3: Iniciar en Paso 1 (Piso 1 hacia la Escalera)
                _currentMapStep = 1;
                _currentMapFloor = 1;
                const stepper = document.getElementById('map-stepper');
                if (stepper) stepper.style.display = 'flex';
                const pill2Text = document.getElementById('step-pill-2-text');
                if (pill2Text) pill2Text.textContent = `Paso 2: Llegar a Piso ${_currentMapTarget.piso} (${_currentMapTarget.name})`;

                // Auto-guía: avanzar automáticamente al Paso 2 tras 4 segundos
                _autoStepTimer = setTimeout(() => {
                    if (_currentMapTarget && _currentMapTarget.piso > 1 && _currentMapStep === 1) {
                        LOG('[Auto-Guide] Avanzando automáticamente a Paso 2 (Piso ' + _currentMapTarget.piso + ')');
                        setMapStep(2);
                    }
                }, 4000);

            } else {
                // Destino en Piso 1 o exploración general
                _currentMapStep = 1;
                _currentMapFloor = _currentMapTarget ? _currentMapTarget.piso : 1;
                const stepper = document.getElementById('map-stepper');
                if (stepper) stepper.style.display = 'none';
            }

            modal.classList.add('active');
            updateMapHeaderAndTabs();
            renderStoreMapSvg();
        }

            // 3. Departamentos / Zonas del piso actual
            floorData.zones.forEach(z => {
                const isTarget = _currentMapTarget && (_currentMapTarget.piso === _currentMapFloor) && (
                    (_currentMapTarget.pasillo && z.pasillo === _currentMapTarget.pasillo) ||
                    (Math.abs(z.x + z.w/2 - _currentMapTarget.x) < 80 && Math.abs(z.y + z.h/2 - _currentMapTarget.y) < 80)
                );

                html += `
                    <g class="svg-dept-zone ${isTarget ? 'highlighted' : ''}">
                        <rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="14" 
                            fill="${z.color}1c" stroke="${z.color}" stroke-width="${isTarget ? '3' : '1.5'}"/>
                        
                        <text x="${z.x + 20}" y="${z.y + 36}" font-size="22">${z.icon || '🛍️'}</text>
                        <text x="${z.x + 50}" y="${z.y + 34}" fill="#ffffff" font-size="13" font-weight="700">${z.name}</text>
                        
                        <!-- Pasillo pill badge -->
                        <rect x="${z.x + 20}" y="${z.y + z.h - 36}" width="70" height="22" rx="6" fill="${z.color}33" stroke="${z.color}88" stroke-width="1"/>
                        <text x="${z.x + 55}" y="${z.y + z.h - 21}" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">${z.pasillo}</text>
                        
                        <text x="${z.x + 100}" y="${z.y + z.h - 21}" fill="#a1a1aa" font-size="11">${z.sector}</text>
                    </g>
                `;
            });

            // 4. Puntos de Servicio (Baños, Cajas, Retiro, Entrada, Servicio al Cliente)
            floorData.services.forEach(s => {
                const isTargetService = _currentMapTarget && (_currentMapTarget.piso === _currentMapFloor) && (
                    Math.abs(s.x - _currentMapTarget.x) < 60 && Math.abs(s.y - _currentMapTarget.y) < 60
                );

                html += `
                    <g transform="translate(${s.x - 45}, ${s.y - 25})">
                        <rect x="0" y="0" width="90" height="50" rx="12" 
                            fill="${isTargetService ? 'rgba(99, 102, 241, 0.3)' : 'rgba(24, 24, 32, 0.75)'}" 
                            stroke="${isTargetService ? '#6366f1' : 'rgba(255, 255, 255, 0.15)'}" 
                            stroke-width="${isTargetService ? '2.5' : '1'}"/>
                        <text x="45" y="24" text-anchor="middle" font-size="18">${s.icon}</text>
                        <text x="45" y="40" text-anchor="middle" fill="#d4d4d8" font-size="9" font-weight="600">${s.name.split('/')[0].slice(0, 14)}</text>
                    </g>
                `;
            });

            // 5. TRAZADO DE RUTA
            if (_currentMapTarget) {
                let pathD = '';
                const isSingleFloor = _currentMapTarget.piso === 1;

                if (isSingleFloor && _currentMapFloor === 1) {
                    // Ruta directa en Piso 1: Tótem (500, 560) -> Corredor (500, destY) -> Destino (destX, destY)
                    const destX = _currentMapTarget.x;
                    const destY = _currentMapTarget.y;
                    pathD = `M 500 560 L 500 ${destY} L ${destX} ${destY}`;
                } else if (_currentMapTarget.piso > 1) {
                    // Ruta multi-piso
                    if (_currentMapFloor === 1 && _currentMapStep === 1) {
                        // Paso 1: Tótem (500, 560) -> Escaleras (500, 325)
                        pathD = `M 500 560 L 500 325`;
                    } else if (_currentMapFloor === _currentMapTarget.piso && _currentMapStep === 2) {
                        // Paso 2: Escaleras (500, 325) -> Corredor (500, destY) -> Destino (destX, destY)
                        const destX = _currentMapTarget.x;
                        const destY = _currentMapTarget.y;
                        pathD = `M 500 325 L 500 ${destY} L ${destX} ${destY}`;
                    }
                }

                if (pathD) {
                    html += `
                        <!-- Línea de resplandor neón -->
                        <path d="${pathD}" class="svg-route-glow" />
                        <!-- Línea animada de flujo -->
                        <path d="${pathD}" class="svg-route-line" />
                    `;
                }
            }

            // 6. MARCADORES Y PINES
            // Tótem "Usted está aquí" (solo en Piso 1)
            if (_currentMapFloor === 1) {
                html += `
                    <g id="totem-pin" transform="translate(500, 560)">
                        <circle cx="0" cy="0" r="24" fill="rgba(16, 185, 129, 0.25)" class="totem-pulse-circle" />
                        <circle cx="0" cy="0" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3" filter="url(#glowFilter)" />
                        <!-- Badge label -->
                        <rect x="-80" y="16" width="160" height="26" rx="8" fill="rgba(6, 78, 59, 0.9)" stroke="#10b981" stroke-width="1.5" />
                        <text x="0" y="33" text-anchor="middle" fill="#ecfdf5" font-size="10" font-weight="800">📍 USTED ESTÁ AQUÍ (TÓTEM)</text>
                    </g>
                `;
            }

            // Pin de Escalera en Piso 1 (cuando sube de piso en Paso 1)
            if (_currentMapTarget && _currentMapTarget.piso > 1 && _currentMapFloor === 1) {
                html += `
                    <g transform="translate(500, 325)" class="dest-bounce-group">
                        <rect x="-85" y="-55" width="170" height="30" rx="10" fill="rgba(180, 83, 9, 0.95)" stroke="#f59e0b" stroke-width="2" filter="url(#glowFilter)"/>
                        <text x="0" y="-35" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="800">🪜 SUBIR AL PISO ${_currentMapTarget.piso}</text>
                    </g>
                `;
            }

            // Pin de Destino (en el piso de destino)
            if (_currentMapTarget && _currentMapFloor === _currentMapTarget.piso) {
                html += `
                    <g transform="translate(${_currentMapTarget.x}, ${_currentMapTarget.y})" class="dest-bounce-group">
                        <circle cx="0" cy="0" r="18" fill="rgba(244, 63, 94, 0.3)" class="totem-pulse-circle" />
                        <circle cx="0" cy="0" r="11" fill="#f43f5e" stroke="#ffffff" stroke-width="3" filter="url(#glowFilter)" />
                        
                        <!-- Tooltip Destino -->
                        <rect x="-90" y="-54" width="180" height="32" rx="10" fill="rgba(15, 23, 42, 0.95)" stroke="#f43f5e" stroke-width="2" />
                        <text x="0" y="-34" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">🎯 ${_currentMapTarget.pasillo || _currentMapTarget.name.slice(0, 16)}</text>
                    </g>
                `;
            }

            svg.innerHTML = html;
        }

        // ─── Detección de Intención de Ubicación en Respuestas del Avatar / Usuario ───
        function checkLocationIntentAndTriggerMap(text) {
            if (!text) return false;
            const t = text.toLowerCase();

            // 1. Prioridad Máxima: Detección por código de Pasillo exacto (ej: B-01, T-02, D-06, etc.)
            const pasilloToCat = {
                'b-01': 'perfumes_mujer', 'b01': 'perfumes_mujer',
                'b-02': 'perfumes_hombre', 'b02': 'perfumes_hombre',
                'd-06': 'zapatillas', 'd06': 'zapatillas',
                'd-07': 'zapatillas', 'd07': 'zapatillas',
                'a-01': 'accesorios', 'a01': 'accesorios',
                'm-01': 'ropa_mujer', 'm01': 'ropa_mujer',
                'm-02': 'ropa_hombre', 'm02': 'ropa_hombre',
                'c-01': 'calzado_mujer', 'c01': 'calzado_mujer',
                'dh-01': 'decohogar', 'dh01': 'decohogar',
                'dh-02': 'decohogar', 'dh02': 'decohogar',
                't-01': 'smartphones', 't01': 'smartphones',
                't-02': 'television', 't02': 'television',
                't-03': 'computacion', 't03': 'computacion',
                't-04': 'audio_gaming', 't04': 'audio_gaming',
                'h-11': 'electrohogar', 'h11': 'electrohogar',
                'h-12': 'electrohogar', 'h12': 'electrohogar',
                'h-13': 'electrohogar', 'h13': 'electrohogar'
            };

            for (const [code, catId] of Object.entries(pasilloToCat)) {
                const regex = new RegExp(`\\b${code}\\b`, 'i');
                if (regex.test(t)) {
                    LOG(`[Location Intent] Coincidencia directa por pasillo "${code}" → ${catId}`);
                    const cat = STORE_MAP_DATA.categories[catId];
                    if (cat) {
                        setTimeout(() => {
                            openStoreMap(cat.piso, cat.x, cat.y, cat.name, cat.pasillo, cat.sector);
                        }, 400);
                        return true;
                    }
                }
            }

            // 2. Prioridad Temática por Palabras Clave (NUNCA incluir 'pantalla' para no chocar con 'se muestra en pantalla')
            const catMap = [
                // 1. Servicios de Postventa / Devoluciones / Cambios / Retiro / Baños (ALTA PRIORIDAD)
                { id: 'servicio_cliente', keywords: ['devolver', 'devolucion', 'devolución', 'devoluciones', 'cambiar', 'cambio', 'cambios', 'reclamo', 'postventa', 'servicio al cliente', 'garantia', 'garantía', 'tarjeta paris', 'tarjeta cencosud'] },
                { id: 'retiro_tienda', keywords: ['retiro', 'retirar', 'click and collect', 'click & collect', 'recoger', 'retiro en tienda', 'compra online', 'compré online', 'compra por internet'] },
                { id: 'banos', keywords: ['baño', 'baños', 'bano', 'banos', 'sshh', 'ss.hh', 'servicios higienicos', 'servicios higiénicos', 'wc', 'lavamanos', 'sanitario', 'sanitarios', 'toilet'] },
                { id: 'probadores', keywords: ['probador', 'probadores', 'probarme', 'medirme', 'cambiador'] },
                { id: 'cajas', keywords: ['caja', 'cajas', 'pagar', 'donde pago', 'dónde pago', 'cajera'] },

                // 2. Departamentos de Belleza y Deportes (Piso 1)
                { id: 'perfumes_mujer', keywords: ['perfume mujer', 'perfumes mujer', 'fragancia mujer', 'maquillaje', 'labial', 'cosmetica', 'cosmética', 'skincare', 'perfume', 'perfumes', 'fragancia', 'fragancias', 'belleza', 'colonia'] },
                { id: 'perfumes_hombre', keywords: ['perfume hombre', 'perfumes hombre', 'colonia hombre', 'fragancia hombre'] },
                { id: 'zapatillas', keywords: ['zapatilla', 'zapatillas', 'calzado deportivo', 'nike', 'adidas', 'puma', 'deporte', 'deportes'] },
                { id: 'accesorios', keywords: ['accesorio', 'accesorios', 'joyeria', 'joyería', 'reloj', 'relojes', 'lentes', 'gafas'] },

                // 3. Departamentos de Moda y Hogar (Piso 2)
                { id: 'ropa_mujer', keywords: ['ropa mujer', 'vestuario mujer', 'vestido', 'vestidos', 'falda', 'faldas', 'blusa', 'blusas'] },
                { id: 'ropa_hombre', keywords: ['ropa hombre', 'vestuario hombre', 'camisa', 'camisas', 'traje', 'trajes'] },
                { id: 'calzado_mujer', keywords: ['calzado mujer', 'calzado femenino', 'zapato', 'zapatos', 'tacon', 'tacones', 'sandalia', 'sandalias', 'botin', 'botines', 'bota', 'botas'] },
                { id: 'decohogar', keywords: ['decohogar', 'cama', 'camas', 'sabana', 'sabanas', 'sábana', 'sábanas', 'almohada', 'almohadas', 'plumon', 'plumón', 'cubrecama', 'toalla', 'toallas'] },

                // 4. Departamentos de Tecnología (Piso 3)
                { id: 'smartphones', keywords: ['smartphone', 'smartphones', 'celular', 'celulares', 'telefono', 'teléfono', 'telefonos', 'teléfonos', 'iphone', 'galaxy', 's25', 's24', 'xiaomi', 'motorola'] },
                { id: 'television', keywords: ['televisor', 'televisores', 'smart tv', 'smart tvs', 'oled', 'qled', 'hisense', 'tele', 'teles', 'tv'] },
                { id: 'computacion', keywords: ['computador', 'computadores', 'notebook', 'notebooks', 'laptop', 'laptops', 'macbook', 'pc', 'computacion', 'computación'] },
                { id: 'audio_gaming', keywords: ['audio', 'parlante', 'parlantes', 'jbl', 'audifono', 'audifonos', 'audífono', 'audífonos', 'gaming', 'playstation', 'ps5', 'consola', 'consolas', 'nintendo', 'xbox', 'smartwatch', 'reloj inteligente'] },
                { id: 'electrohogar', keywords: ['electrohogar', 'refrigerador', 'refrigeradores', 'lavadora', 'lavadoras', 'secadora', 'cocina', 'microondas', 'linea blanca', 'línea blanca', 'climatizacion', 'climatización', 'aire acondicionado', 'estufa'] }
            ];

            const isLocationQuestion = t.includes('donde') || t.includes('dónde') || t.includes('ubicacion') || 
                                     t.includes('ubicación') || t.includes('pasillo') || t.includes('piso') || 
                                     t.includes('llegar') || t.includes('encuentro') || t.includes('muestra en pantalla') ||
                                     t.includes('devolver') || t.includes('cambiar') || t.includes('retiro') || t.includes('baño');

            for (const item of catMap) {
                const matched = item.keywords.some(k => {
                    if (k.length <= 3) {
                        return new RegExp(`\\b${k}\\b`, 'i').test(t);
                    }
                    return t.includes(k);
                });

                if (matched) {
                    if (isLocationQuestion || t.includes('pasillo') || t.includes('piso') || t.includes('muestra en pantalla')) {
                        LOG(`[Location Intent] Coincidencia por palabra clave: ${item.id}`);
                        const cat = STORE_MAP_DATA.categories[item.id];
                        if (cat) {
                            setTimeout(() => {
                                openStoreMap(cat.piso, cat.x, cat.y, cat.name, cat.pasillo, cat.sector);
                            }, 400);
                        }
                        return true;
                    }
                }
            }
            return false;
        }

        // ══════════════════════════════════════════════════════════════════════════════
        // CARRUSEL DE OFERTAS
        // ══════════════════════════════════════════════════════════════════════════════
        (function initCarousel() {
            const slides = document.querySelectorAll('.carousel-slide');
            const dotsContainer = document.getElementById('carousel-dots');
            let current = 0;
            let carouselTimer = null;
            let pausedBySpeaking = false;

            // Generar dots dinámicamente
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                dotsContainer.appendChild(dot);
            });

            const dots = dotsContainer.querySelectorAll('.carousel-dot');

            function goTo(index) {
                slides[current].classList.remove('active');
                dots[current].classList.remove('active');
                current = (index + slides.length) % slides.length;
                slides[current].classList.add('active');
                dots[current].classList.add('active');
            }

            function startAuto() {
                stopAuto();
                carouselTimer = setInterval(() => {
                    if (!pausedBySpeaking) goTo(current + 1);
                }, 4500);
            }

            function stopAuto() {
                if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
            }

            startAuto();

            // Pausar cuando el avatar está hablando para no distraer
            const _origStartSpeakingMonitor = typeof startSpeakingMonitor === 'function' ? startSpeakingMonitor : null;

            // Observador de clase: cuando avatar-speaking se agrega/quita en #avatar-wrap
            const speakObs = new MutationObserver(() => {
                const wrap = document.getElementById('avatar-wrap');
                if (wrap && wrap.classList.contains('avatar-speaking')) {
                    pausedBySpeaking = true;
                } else {
                    // Reanudar tras breve pausa cuando el avatar termina
                    setTimeout(() => { pausedBySpeaking = false; }, 2000);
                }
            });

            const avatarWrap = document.getElementById('avatar-wrap');
            if (avatarWrap) {
                speakObs.observe(avatarWrap, { attributes: true, attributeFilter: ['class'] });
            }

            LOG('Carrusel de ofertas iniciado (' + slides.length + ' slides, intervalo 4.5s)');
        })();

        // ─── Auto-conectar al cargar ───────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isFirefox = /Firefox\//.test(navigator.userAgent);

            LOG('DOMContentLoaded - isMobile:', isMobile, '| isFirefox:', isFirefox);
            LOG('Secure context:', window.isSecureContext, '| protocol:', location.protocol);

            if (!window.isSecureContext) {
                WARN('CONTEXTO NO SEGURO (HTTP). SpeechRecognition NO funcionara. Usar HTTPS.');
            }

            if (isFirefox) {
                WARN('Firefox detectado: SpeechRecognition NO disponible en Firefox.');
                WARN('Para usar el micrófono usa Chrome, Chromium o Edge.');
            }

            if (isMobile) {
                LOG('Mobile detectado - overlay visible, esperando tap');
            } else {
                LOG('Desktop detectado - auto-conectando.');
                const overlay = document.getElementById('tap-overlay');
                if (overlay) overlay.style.display = 'none';
                setTimeout(connectRTC, 800);
            }

            // Desbloqueo global de audio con cualquier interacción del usuario (click, tecla o touch)
            const _globalUnlockAudio = () => {
                const videoEl = document.getElementById('video');
                if (videoEl && videoEl.muted) {
                    videoEl.muted = false;
                    _audioUnlocked = true;
                    if (videoEl.paused && videoEl.srcObject) {
                        videoEl.play().catch(e => WARN('video.play() en unlock global:', e.name));
                    }
                    LOG('Audio del avatar desbloqueado por interacción del usuario');
                }
            };
            document.addEventListener('click', _globalUnlockAudio);
            document.addEventListener('keydown', _globalUnlockAudio);
            document.addEventListener('touchstart', _globalUnlockAudio);

            // Inicializar foco y escucha del lector de código de barras
            const barcodeInp = document.getElementById('barcode-input');
            if (barcodeInp) {
                barcodeInp.focus();
                barcodeInp.addEventListener('keydown', async (e) => {
                    if (e.key === 'Enter') {
                        const code = barcodeInp.value.trim();
                        barcodeInp.value = '';
                        if (code) {
                            await handleBarcodeScan(code);
                        }
                    }
                });
            }
            setInterval(keepBarcodeFocus, 400);
        });
    </script>

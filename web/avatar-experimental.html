<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #6366f1;
            --accent-glow: #818cf8;
            --accent-dim: #4338ca;
            --danger: #ef4444;
            --bg: #09090b;
            --surface: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f4f4f5;
            --text-muted: #71717a;
            --radius: 16px;
            /* mic verde */
            --mic-green: #22c55e;
            --mic-green-dim: #15803d;
            --mic-green-glow: rgba(34, 197, 94, 0.55);
        }

        html,
        body {
            height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        /* ── Fullscreen wrapper ──────────────────────────────── */
        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* ── Avatar ocupa toda la pantalla ──────────────────── */
        #avatar-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--surface);
        }

        #video {
            width: 100%;
            height: 100%;
            /* position: absolute;
            top: 25%; */
            object-fit: contain;
            /* muestra el avatar completo sin recortar */
            object-position: center center;
            display: block;
            background: #000;
        }

        /* Gradient overlay at bottom (para legibilidad del mic) */
        #avatar-wrap::after {
            content: '';
            position: absolute;
            inset: auto 0 0 0;
            height: 30%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
            pointer-events: none;
        }

        /* Speaking indicator (ring desactivado) */
        #speaking-ring {
            display: none;
        }

        /* ── Status badge ─────────────────────────────────────── */
        #status-badge {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
            white-space: nowrap;
            transition: opacity 0.3s;
        }

        #status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
            flex-shrink: 0;
        }

        /* Status variants */
        body.state-connecting #status-dot {
            background: #f59e0b;
            animation: dot-blink 1s ease-in-out infinite;
        }

        body.state-ready #status-dot {
            background: #22c55e;
        }

        body.state-listening #status-dot {
            background: var(--accent-glow);
            animation: dot-blink 0.6s ease-in-out infinite;
        }

        body.state-processing #status-dot {
            background: #f59e0b;
            animation: dot-blink 0.4s linear infinite;
        }

        body.state-thinking #status-dot {
            background: #a78bfa;
            animation: dot-blink 0.35s linear infinite;
        }

        body.state-speaking #status-dot {
            background: #22c55e;
            animation: dot-blink 0.8s ease-in-out infinite;
        }

        @keyframes dot-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        /* ── Transcript overlay (sobre el video, arriba del botón stop) */
        #transcript-wrap {
            position: absolute;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: min(500px, 88vw);
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .transcript-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadein 0.3s ease;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transcript-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
            flex-shrink: 0;
            width: 32px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .transcript-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
        }

        .transcript-text.dim {
            color: var(--text-muted);
        }

        /* ── Botón STOP Avatar (corte manual inmediato) ───────────── */
        #btn-stop-talk {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) scale(0.92);
            z-index: 35;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border-radius: 999px;
            border: 1px solid rgba(239, 68, 68, 0.45);
            background: rgba(24, 15, 20, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(239, 68, 68, 0.2);
            user-select: none;
            -webkit-user-select: none;
        }

        #btn-stop-talk .stop-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            transition: transform 0.2s ease;
        }

        #btn-stop-talk .stop-label {
            line-height: 1;
        }

        /* Cuando el avatar está hablando o pensando, el botón se activa con animación */
        body.state-speaking #btn-stop-talk,
        body.state-thinking #btn-stop-talk {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
            transform: translateX(-50%) scale(1);
            animation: pulse-stop-glow 2s ease-in-out infinite;
        }

        #btn-stop-talk:hover {
            background: rgba(239, 68, 68, 0.35);
            border-color: rgba(239, 68, 68, 0.8);
            box-shadow: 0 6px 28px rgba(239, 68, 68, 0.45), 0 0 12px rgba(239, 68, 68, 0.3);
            transform: translateX(-50%) scale(1.05);
        }

        #btn-stop-talk:hover .stop-icon {
            transform: scale(1.15);
        }

        #btn-stop-talk:active {
            transform: translateX(-50%) scale(0.96);
            background: rgba(239, 68, 68, 0.5);
        }

        @keyframes pulse-stop-glow {
            0%, 100% {
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.25), 0 0 0 1px rgba(239, 68, 68, 0.2);
            }
            50% {
                box-shadow: 0 4px 26px rgba(239, 68, 68, 0.55), 0 0 16px rgba(239, 68, 68, 0.4);
            }
        }

        /* ── Botón MIC: oculto en modo always-on wake-word ─────────── */
        #btn-mic {
            display: none !important;
        }

        /* ── Botón conectar (top-left, discreto) ────────────── */
        #btn-connect {
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 30;

            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(24, 24, 27, 0.70);
            backdrop-filter: blur(8px);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #btn-connect:hover {
            background: rgba(39, 39, 42, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text);
        }

        #btn-connect.connected {
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* ── Botón PANTALLA COMPLETA (esquina sup-derecha, invisible) */
        #btn-fullscreen {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 50;
            width: 56px;
            height: 56px;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0;
            /* invisible */
            -webkit-tap-highlight-color: transparent;
        }

        /* Pequeño hover hint opcional — quítalo si prefieres que sea 100% invisible */
        /* #btn-fullscreen:hover { opacity: 0.15; background: white; border-radius: 0 0 0 8px; } */

        /* ── Tap overlay animation ───────────────────────────── */
        @keyframes tap-pulse {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(99, 102, 241, 0.5), 0 0 0 0 rgba(99, 102, 241, 0.4);
            }

            50% {
                box-shadow: 0 0 50px rgba(99, 102, 241, 0.8), 0 0 0 18px rgba(99, 102, 241, 0);
            }
        }

        /* ── Hidden audio / inputs ──────────────────────────── */
        audio {
            display: none;
        }

        input[type=hidden] {
            display: none;
        }

        /* ── Debug log panel ────────────────────────────────── */
        #dbg-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(10px);
            color: #f4f4f5;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #dbg-btn:hover {
            background: rgba(39, 39, 42, 0.9);
            transform: scale(1.08);
        }

        #dbg-panel {
            position: fixed;
            inset: 0;
            z-index: 199;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 11px;
        }

        #dbg-panel.open {
            display: flex;
        }

        #dbg-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        #dbg-toolbar span {
            color: #a1a1aa;
            font-size: 12px;
            font-family: inherit;
        }

        #dbg-clear {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.8);
            color: #f4f4f5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        #dbg-close {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(127, 29, 29, 0.5);
            color: #fca5a5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 8px;
        }

        #dbg-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dbg-entry {
            display: flex;
            gap: 8px;
            line-height: 1.5;
            word-break: break-all;
        }

        .dbg-ts {
            color: #52525b;
            flex-shrink: 0;
        }

        .dbg-log .dbg-msg {
            color: #d4d4d8;
        }

        .dbg-warn .dbg-msg {
            color: #fbbf24;
        }

        .dbg-err .dbg-msg {
            color: #f87171;
        }

        .dbg-label-log {
            color: #6366f1;
            font-weight: 600;
            flex-shrink: 0;
        }

        .dbg-label-warn {
            color: #f59e0b;
            font-weight: 600;
            flex-shrink: 0;
        }

        .dbg-label-err {
            color: #ef4444;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* Fila de selector de mic */
        #dbg-mic-row {
            padding: 8px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        #dbg-mic-row label {
            color: #a1a1aa;
            font-size: 11px;
            font-family: inherit;
            flex-shrink: 0;
        }

        #dbg-mic-select {
            flex: 1;
            min-width: 160px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.9);
            color: #f4f4f5;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        #dbg-mic-refresh {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.8);
            color: #f4f4f5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        

        

        

        

        /* ── Responsividad en dispositivos móviles y tabletas ── */
        @media (max-width: 768px) {
            /* Video cubre toda la pantalla en móviles, recortando lados si el video es horizontal */
            #video {
                object-fit: cover;
            }

            /* Botón de conectar más accesible al tacto */
            #btn-connect {
                top: 16px;
                left: 16px;
                height: 36px;
                padding: 0 16px;
                font-size: 13px;
                gap: 6px;
                border-radius: 12px;
            }
            #btn-connect svg {
                width: 12px;
                height: 12px;
            }

            /* Indicador de estado más visible */
            #status-badge {
                bottom: 16px;
                font-size: 13px;
                padding: 8px 16px;
            }

            /* Transcripción más legible */
            #transcript-wrap {
                bottom: 48px;
                width: 90vw;
            }
            .transcript-text {
                font-size: 15px;
            }
            .transcript-label {
                font-size: 11px;
                width: 36px;
            }

            /* Panel de depuración móvil */
            #dbg-panel {
                padding-bottom: 20px;
            }
            #dbg-toolbar span {
                font-size: 14px;
            }
            #dbg-clear, #dbg-close {
                padding: 6px 14px;
                font-size: 12px;
            }
            #dbg-mic-row, 
            #dbg-mic-select, 
            #dbg-list {
                font-size: 12px;
            }
        }

        /* ── Burbujas de chat sobrepuestas ── */
        #chat-container {
            position: absolute;
            left: 20px;
            bottom: 140px;
            width: min(350px, 85vw);
            max-height: 40vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 25;
            pointer-events: auto;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.45;
            max-width: 85%;
            word-break: break-word;
            animation: bubble-appear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(24, 24, 27, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f4f4f5;
        }
        .chat-bubble.user {
            align-self: flex-end;
            background: rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.4);
            color: #e0e7ff;
        }
        .chat-bubble.avatar {
            align-self: flex-start;
        }
        .chat-bubble.system {
            align-self: center;
            background: rgba(24, 24, 27, 0.35);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 12px;
            text-align: center;
            font-style: italic;
            box-shadow: none;
            max-width: 90%;
        }
        @keyframes bubble-appear {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-bubble.fade-out {
            animation: bubble-fadeout 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes bubble-fadeout {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-10px) scale(0.95); max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; border-top-width: 0; border-bottom-width: 0; opacity: 0; }
        }

        /* ── Carrusel de ofertas (parte superior, superpuesto) ── */
        #offers-carousel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 160px;
            z-index: 40;
            overflow: hidden;
            pointer-events: none;
        }

        /* Fade superior e inferior para integrarse al video */
        #offers-carousel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 28px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.72), transparent);
            z-index: 2;
            pointer-events: none;
        }
        #offers-carousel::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            z-index: 2;
            pointer-events: none;
        }

        /* Fade lateral izquierdo y derecho */
        #carousel-fade-left,
        #carousel-fade-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 60px;
            z-index: 3;
            pointer-events: none;
        }
        #carousel-fade-left {
            left: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.7), transparent);
        }
        #carousel-fade-right {
            right: 0;
            background: linear-gradient(to left, rgba(0,0,0,0.7), transparent);
        }

        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .carousel-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.9s ease;
            display: flex;
            align-items: stretch;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            flex-shrink: 0;
        }

        /* Slide con dos imágenes angostas, 50% cada una */
        .carousel-slide.dual img {
            width: 50%;
            height: 100%;
            object-fit: fill;
            display: block;
            flex-shrink: 0;
        }

        /* Dots indicadores */
        #carousel-dots {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 6px;
            pointer-events: none;
        }

        .carousel-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transition: background 0.4s, transform 0.4s;
        }

        .carousel-dot.active {
            background: rgba(255,255,255,0.95);
            transform: scale(1.4);
        }

        /* ─── Tarjeta de Producto (Escáner de Código de Barras) ────────── */
        #product-card-container {
            position: absolute;
            right: 30px;
            bottom: 120px;
            z-index: 40;
            width: min(380px, 90vw);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            background: rgba(18, 18, 22, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.35);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 18px 20px;
            color: #f4f4f5;
            animation: card-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card-badge {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(67, 56, 202, 0.4));
            border: 1px solid rgba(129, 140, 248, 0.4);
            color: #c7d2fe;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-card-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
        }

        .product-card-category {
            font-size: 12px;
            color: #a1a1aa;
            margin-top: -4px;
        }

        .product-card-prices {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-top: 4px;
        }

        .product-card-price-main {
            font-size: 24px;
            font-weight: 800;
            color: #34d399;
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.3);
        }

        .product-card-price-regular {
            font-size: 15px;
            color: #a1a1aa;
            text-decoration: line-through;
        }

        #store-map-svg {
            width: 100%;
            height: 100%;

        /* Estilos de Elementos SVG */
        .svg-grid-line { stroke: rgba(255, 255, 255, 0.025); stroke-width: 1; }

        .svg-dept-zone {

        @keyframes zone-glow {
            from { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.6)) brightness(1.2); }
            to { filter: drop-shadow(0 0 24px rgba(99, 102, 241, 0.95)) brightness(1.4); }

        /* Ruta Animada de Neón */
        .svg-route-glow {

        @keyframes route-flow {
            to { stroke-dashoffset: -40; }

        /* Pines y Marcadores SVG */

        .dest-bounce-group {

            0%, 100% { transform: translateY(0); }

        /* Footer de Instrucciones de Ruta */
        .map-footer {

        .map-action-btn {

                            <div class="map-route-text-main" id="map-route-text-main">Plano de Paris Costanera Center</div>

    <!-- Debug log panel (tap 🪲 to open) -->
    <div id="dbg-panel">
        <div id="dbg-toolbar">
            <span>🪲 Consola de depuración</span>
            <div style="display:flex;gap:4px">
                <button id="dbg-clear" onclick="dbgClear()">Limpiar</button>
                <button id="dbg-close" onclick="dbgToggle()">Cerrar ✕</button>
            </div>
        </div>
        <!-- Selector de micrófono -->
        <div id="dbg-mic-row">
            <label>🎤 Micrófono:</label>
            <select id="dbg-mic-select" onchange="dbgSelectMic(this.value)">
                <option value="">-- default del sistema --</option>
            </select>
            <button id="dbg-mic-refresh" onclick="dbgLoadDevices()">&#8635; Actualizar</button>
        </div>
        
        <div id="dbg-list"></div>
    </div>

    <!-- WebRTC client -->
    <script src="client.js"></script>

    <script>
        // ══════════════════════════════════════════════════════════════════════════════
        // DEBUG LOGGER — escribe en consola del navegador Y en el panel on-screen 🪲
        // ══════════════════════════════════════════════════════════════════════════════
        const _DBG_MAX = 200;

        function _dbgWrite(level, args) {
            if (level === 'log') console.log('[Avatar]', ...args);
            if (level === 'warn') console.warn('[Avatar]', ...args);
            if (level === 'err') console.error('[Avatar]', ...args);

            const list = document.getElementById('dbg-list');
            if (!list) return;

            const now = new Date();
            const ts = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.${String(now.getMilliseconds()).padStart(3, '0')}`;
            const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');

            const entry = document.createElement('div');
            entry.className = `dbg-entry dbg-${level}`;
            entry.innerHTML =
                `<span class="dbg-ts">${ts}</span>` +
                `<span class="dbg-label-${level}">${level.toUpperCase()}</span>` +
                `<span class="dbg-msg">${msg.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`;
            list.appendChild(entry);

            while (list.children.length > _DBG_MAX) list.removeChild(list.firstChild);

            const panel = document.getElementById('dbg-panel');
            if (panel && panel.classList.contains('open')) {
                list.scrollTop = list.scrollHeight;
            }
        }

        const LOG = (...args) => _dbgWrite('log', args);
        const WARN = (...args) => _dbgWrite('warn', args);
        const ERR = (...args) => _dbgWrite('err', args);

        function dbgToggle() {
            const panel = document.getElementById('dbg-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                const list = document.getElementById('dbg-list');
                list.scrollTop = list.scrollHeight;
            }
        }

        function dbgClear() {
            const list = document.getElementById('dbg-list');
            list.innerHTML = '';
            LOG('Consola limpiada');
        }

        // ─── Selector de micrófono en panel debug ─────────────────────────────────
        let _preferredDeviceId = null;

        async function dbgLoadDevices() {
            const sel = document.getElementById('dbg-mic-select');
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                WARN('enumerateDevices no disponible en este dispositivo');
                return;
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                LOG(`Micrófonos disponibles: ${audioInputs.length}`);
                audioInputs.forEach((d, i) => {
                    LOG(`  [${i}] id="${d.deviceId.slice(0, 16)}…" label="${d.label || '(sin permiso)'}"`);
                });

                if (sel) {
                    sel.innerHTML = '<option value="">-- default del sistema --</option>';
                    audioInputs.forEach((d, i) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label
                            ? d.label
                            : `Micrófono ${i + 1}  (${d.deviceId.slice(0, 8)}…)`;
                        if (d.deviceId === _preferredDeviceId) opt.selected = true;
                        sel.appendChild(opt);
                    });
                }

                if (audioInputs.length === 0) ERR('¡No se encontraron micrófonos!');
            } catch (e) {
                ERR('dbgLoadDevices error:', e.name, e.message);
            }
        }

        function dbgSelectMic(deviceId) {
            _preferredDeviceId = deviceId || null;
            if (_preferredDeviceId) {
                const sel = document.getElementById('dbg-mic-select');
                const label = sel?.options[sel.selectedIndex]?.textContent || deviceId;
                LOG(`🎤 Micrófono seleccionado: "${label}"`);
            } else {
                LOG('🎤 Micrófono: default del sistema');
            }
        }

        LOG('=== INIT ===');
        LOG('UA:', navigator.userAgent);
        LOG('Secure context:', window.isSecureContext);
        LOG('SpeechRecognition:', !!(window.SpeechRecognition || window.webkitSpeechRecognition));
        LOG('getUserMedia:', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
        LOG('Protocol:', location.protocol, '| Host:', location.host);

        // ─── Estado ────────────────────────────────────────────────────────────────
        let isConnected = false;
        let isListening = false;
        let recognition = null;
        let isSpeaking = false;
        let speakCheckInterval = null;
        let _audioUnlocked = false;

        // ─── Wake-word & Modo Conversación Abierta (Experimental) ───────────────
        const WAKE_WORDS = ['hola', 'oye', 'disculpa', 'permiso', 'necesito ayuda', 'asistente', 'buenas'];
        const WAKE_WORD = WAKE_WORDS[0];

        let _wakeDetected = false;
        let _alwaysOnActive = false;

        let _conversationAwake = false;  // true si el flujo de conversación está activo sin requerir wake-word
        let _inactivityTimeoutId = null; // temporizador de inactividad
        let _followUpTimeoutId = null;   // ID del temporizador para preguntar si necesita algo más
        let _waitingFollowUpAck = false;  // true cuando se preguntó "¿Necesitas algo más?" y esperamos respuesta
        let _followUpAckTimeoutId = null; // timer del segundo wait de 30s tras "¿Necesitas algo más?"
        let _pendingAvatarBubbleText = null;    // Texto de respuesta del LLM en cola para mostrar cuando empiece a hablar
        let _pendingAvatarBubbleTimeout = null; // Timeout de seguridad para la burbuja en cola
        const INACTIVITY_TIMEOUT_MS = 120000;   // 2 minutos antes de volver a modo de espera

        const BUFFER_MS = 5000;                 // ms de espera para pregunta tras la wake-word
        let _wakeBufferTimeout = null;

        const WAKE_ONLY_GREETINGS = [
            '¡Hola! ¿En qué te puedo ayudar?',
            '¡Buenas! ¿Buscas algo en especial?',
            '¡Hola! ¿Necesitas ayuda para encontrar algo?',
            'Aquí estoy, ¿en qué te ayudo?'
        ];

        function _randomGreeting() {
            return WAKE_ONLY_GREETINGS[Math.floor(Math.random() * WAKE_ONLY_GREETINGS.length)];
        }

        function _containsWakeWord(text) {
            const lower = text.toLowerCase();
            return WAKE_WORDS.some(w => lower.includes(w));
        }

        function _extractQuestion(text) {
            const lower = text.toLowerCase();
            let best = { idx: -1, word: '' };
            for (const w of WAKE_WORDS) {
                const i = lower.indexOf(w);
                if (i !== -1 && (best.idx === -1 || i < best.idx)) {
                    best = { idx: i, word: w };
                }
            }
            if (best.idx === -1) return text.trim();
            return text.slice(best.idx + best.word.length).replace(/^[,\.\s¿¡]+/, '').trim();
        }

        function _isSleepWord(text) {
            const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?¡!]/g,"").trim();
            // Frases exactas de despedida o cierre negativo
            const exactSleepPhrases = [
                'no', 'no gracias', 'no muchas gracias', 'no por ahora', 'no nada mas',
                'no ya no', 'no seria todo', 'no eso seria todo', 'no eso es todo',
                'no por el momento', 'no de momento', 'no gracias chao',
                'gracias', 'muchas gracias', 'chao', 'adios', 'hasta luego',
                'nada', 'no nada', 'nada mas', 'nada gracias', 'ninguna', 'ninguno',
                'ninguno gracias', 'ninguna gracias', 'todo bien', 'todo bien gracias',
                'eso es todo', 'eso seria todo', 'nos vemos',
                'que estes bien', 'chao chao', 'bye', 'seria todo', 'listo gracias'
            ];
            if (exactSleepPhrases.includes(clean)) {
                return true;
            }

            // Prefijos de despedida explícita (NUNCA incluir 'no' aquí para no cortar frases como 'no hay este producto')
            const farewellPrefixes = [
                'chao ', 'adios ', 'hasta luego ', 'nos vemos ', 'bye ', 'muchas gracias ', 'gracias por '
            ];
            if (farewellPrefixes.some(pre => clean.startsWith(pre))) {
                return true;
            }

            return false;
        }

        function clearServerHistory() {
            const sessionid = document.getElementById('sessionid').value;
            LOG('Borrando historial de conversación en servidor para sesión:', sessionid);
            fetch('/clear_history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionid: String(sessionid) })
            }).catch(e => WARN('clearServerHistory error:', e));
        }

        function sleepModel(showBubble = false) {
            LOG("Durmiendo el modelo experimental (conversación cerrada).");
            closeStoreMap();
            _conversationAwake = false;
            _wakeDetected = false;
            _waitingFollowUpAck = false;
            clearTimeout(_inactivityTimeoutId);
            clearTimeout(_followUpTimeoutId);
            clearTimeout(_followUpAckTimeoutId);
            clearServerHistory();
            if (isListening) {
                setState('listening', 'Esperando activación…');
            } else {
                setState('ready', 'Esperando activación…');
            }
            if (showBubble) {
                addChatBubble('system', 'Conversación finalizada. Di "Hola" para activar de nuevo.');
            }
        }

        function wakeUpModel() {
            if (!_conversationAwake) {
                LOG("Despertando el modelo experimental (conversación abierta).");
                _conversationAwake = true;
                const container = document.getElementById('chat-container');
                if (container) container.innerHTML = '';
            }
            resetInactivityTimer();
        }

        function resetInactivityTimer() {
            clearTimeout(_inactivityTimeoutId);
            if (!_conversationAwake) return;
            _inactivityTimeoutId = setTimeout(() => {
                LOG("Sesión inactiva por 2 minutos. Volviendo a modo de espera de wake-word.");
                closeStoreMap();
                _conversationAwake = false;
                _wakeDetected = false;
                if (isListening) {
                    setState('listening', 'Esperando activación…');
                } else {
                    setState('ready', 'Esperando activación…');
                }
                clearServerHistory();
                const container = document.getElementById('chat-container');
                if (container) container.innerHTML = '';
            }, INACTIVITY_TIMEOUT_MS);
        }

        function normalizarTexto(text) {
            if (!text) return '';
            return text
                .replace(/(\d+)\s*%/g, '$1 por ciento')
                .replace(/\$(\d[\d\.]*)\s*(?:pesos)?/g, '$1 pesos')
                .replace(/[→⇒➜➞➝➔]|->|=>|<-|<=|↔/g, ' ')
                .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')
                .replace(/_{1,3}([^_]+)_{1,3}/g, '$1')
                .replace(/~~([^~]+)~~/g, '$1')
                .replace(/`+([^`]+)`+/g, '$1')
                .replace(/^\s*#{1,6}\s*/gm, '')
                .replace(/[-—–]+/g, ' ')
                .replace(/[*#|_\\/\[\]{}~^<>•·●○■◆▪\(\)]/g, ' ')
                .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]|[\u2300-\u23FF]|[\u2B50-\u2B55]/g, '')
                .replace(/\s+([,.:;?!])/g, '$1')
                .replace(/[,]{2,}/g, ',')
                .replace(/[.]{2,}/g, '.')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function addChatBubble(role, text) {
            const container = document.getElementById('chat-container');
            if (!container) return;

            const cleanText = (role === 'avatar') ? normalizarTexto(text) : text;

            // Evitar duplicar burbujas de sistema consecutivas idénticas
            if (role === 'system' && container.lastElementChild && container.lastElementChild.textContent.trim() === text.trim()) {
                return container.lastElementChild;
            }

            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role}`;
            bubble.textContent = cleanText;
            container.appendChild(bubble);

            container.scrollTop = container.scrollHeight;

            while (container.children.length > 5) {
                container.removeChild(container.firstChild);
            }

            setTimeout(() => {
                bubble.classList.add('fade-out');
                setTimeout(() => {
                    if (bubble.parentNode) {
                        bubble.parentNode.removeChild(bubble);
                    }
                }, 500);
            }, 30000);

            return bubble;
        }

        function queueAvatarBubble(text) {
            clearTimeout(_pendingAvatarBubbleTimeout);
            _pendingAvatarBubbleText = text;
            
            if (isSpeaking) {
                addChatBubble('avatar', _pendingAvatarBubbleText);
                _pendingAvatarBubbleText = null;
                return;
            }
            
            _pendingAvatarBubbleTimeout = setTimeout(() => {
                if (_pendingAvatarBubbleText) {
                    addChatBubble('avatar', _pendingAvatarBubbleText);
                    _pendingAvatarBubbleText = null;
                }
            }, 4000);
        }

        function scheduleFollowUp() {
            clearTimeout(_followUpTimeoutId);
            clearTimeout(_followUpAckTimeoutId);
            _waitingFollowUpAck = false;
            if (!_conversationAwake) return;
            _followUpTimeoutId = setTimeout(() => {
                LOG("30 segundos de silencio → Preguntando si necesita algo más.");
                const followUpText = "¿Necesitas algo más?";
                _waitingFollowUpAck = true;
                
                queueAvatarBubble(followUpText);
                stopAlwaysOnListening();
                
                const sessionid = document.getElementById('sessionid').value;
                fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: followUpText,
                        type: 'echo',
                        sessionid: String(sessionid)
                    })
                }).catch(e => WARN('Error al enviar follow-up:', e));
            }, 30000);
        }

        function scheduleFollowUpAckTimeout() {
            clearTimeout(_followUpAckTimeoutId);
            if (!_waitingFollowUpAck || !_conversationAwake) return;
            LOG('scheduleFollowUpAckTimeout: esperando 20s respuesta al follow-up…');
            _followUpAckTimeoutId = setTimeout(() => {
                if (!_waitingFollowUpAck) return;
                LOG('20s sin respuesta al follow-up → cerrando mapa, enviando despedida final y durmiendo.');
                _waitingFollowUpAck = false;
                closeStoreMap();
                const farewellText = "Muy bien, si necesitas algo más no dudes en llamarme. ¡Que tengas un excelente día!";
                queueAvatarBubble(farewellText);
                stopAlwaysOnListening();
                clearServerHistory();
                _conversationAwake = false;
                _wakeDetected = false;
                clearTimeout(_inactivityTimeoutId);
                clearTimeout(_followUpTimeoutId);
                const sessionid = document.getElementById('sessionid').value;
                fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: farewellText,
                        type: 'echo',
                        sessionid: String(sessionid)
                    })
                }).then(() => {
                    addChatBubble('system', 'Conversación finalizada. Di "Hola" para activar de nuevo.');
                    setState('ready', 'Esperando activación…');
                }).catch(e => WARN('Error al enviar despedida final:', e));
            }, 20000);
        }

        // ─── Lector de Código de Barras (Escáner USB / Bluetooth) ──────────────────
        let _cardDismissTimeout = null;

        function keepBarcodeFocus() {
            const inp = document.getElementById('barcode-input');
            if (!inp) return;
            const dbgPanel = document.getElementById('dbg-panel');
            if (dbgPanel && dbgPanel.classList.contains('open')) return;
            if (document.activeElement !== inp) {
                inp.focus();
            }
        }

        async function handleBarcodeScan(code) {
            LOG(`Escáner de código de barras detectado: "${code}"`);
            try {
                const res = await fetch(`/api/producto/barcode/${encodeURIComponent(code)}`);
                const result = await res.json();

                if (result.code === 0 && result.data) {
                    const prod = result.data;
                    LOG('Producto encontrado:', prod.nombre);
                    showProductCard(prod);

                    // Desbloquear audio del video explícitamente ante el escaneo
                    const videoEl = document.getElementById('video');
                    if (videoEl && videoEl.muted) {
                        videoEl.muted = false;
                        _audioUnlocked = true;
                        if (videoEl.paused && videoEl.srcObject) {
                            videoEl.play().catch(e => WARN('play() barcode unlock:', e.name));
                        }
                        LOG('Audio desbloqueado por escaneo de producto');
                    }

                    // Mensaje de contexto comercial para el LLM (ultra conciso)
                    const precioReg = Number(prod.precio).toLocaleString('es-CL');
                    let llmContextMsg = `Producto escaneado: ${prod.nombre}. Marca: ${prod.marca || ''}. `;
                    if (prod.oferta === 'SI' && prod.precio_oferta) {
                        const precioOf = Number(prod.precio_oferta).toLocaleString('es-CL');
                        const dcto = prod.descuento_pct ? ` con ${prod.descuento_pct} por ciento de descuento` : '';
                        llmContextMsg += `En oferta a ${precioOf} pesos${dcto} (antes ${precioReg} pesos). `;
                    } else {
                        llmContextMsg += `Precio: ${precioReg} pesos. `;
                    }
                    const pisoStr = prod.piso ? `Piso ${prod.piso}` : 'Piso 1';
                    const pasilloStr = prod.pasillo || '';
                    const sectorStr = prod.sector || '';
                    llmContextMsg += `Ubicación: ${pisoStr}, ${sectorStr}, ${pasilloStr}.`;

                    const sessionid = document.getElementById('sessionid').value;

                    clearTimeout(_followUpTimeoutId);
                    clearTimeout(_followUpAckTimeoutId);
                    _waitingFollowUpAck = false;

                    clearServerHistory();
                    wakeUpModel();
                    stopAlwaysOnListening();

                    try {
                        if (_activeLLMAbortController) {
                            try { _activeLLMAbortController.abort(); } catch (e) {}
                        }
                        _activeLLMAbortController = new AbortController();

                        const llmRes = await fetch('/human', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                text: llmContextMsg,
                                type: 'chat',
                                interrupt: true,
                                stream: true,
                                sessionid: String(sessionid)
                            }),
                            signal: _activeLLMAbortController.signal
                        });

                        if (llmRes.body) {
                            const reader = llmRes.body.getReader();
                            const decoder = new TextDecoder('utf-8');
                            let fullText = '';
                            let avatarBubble = null;

                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;
                                const chunk = decoder.decode(value, { stream: true });
                                fullText += chunk;
                                if (!avatarBubble && fullText.trim()) {
                                    avatarBubble = addChatBubble('avatar', '');
                                }
                                if (avatarBubble) {
                                    avatarBubble.textContent = normalizarTexto(fullText);
                                    const container = document.getElementById('chat-container');
                                    if (container) container.scrollTop = container.scrollHeight;
                                }
                            }
                            if (avatarBubble) {
                                avatarBubble.textContent = normalizarTexto(fullText);
                            }
                            LOG('handleBarcodeScan: respuesta LLM completa:', fullText);
                        }
                    } catch (e) {
                        if (e && e.name === 'AbortError') {
                            LOG('handleBarcodeScan: streaming cancelado por STOP/interrupción');
                            return;
                        }
                        ERR('handleBarcodeScan error:', e);
                    } finally {
                        _activeLLMAbortController = null;
                    }

                } else {
                    WARN(`Producto no encontrado para el código: ${code}`);
                    showProductNotFound(code);

                    const notFoundText = `Lo siento, no encontré ningún producto registrado con ese código de barras en el catálogo de Paris.`;
                    const sessionid = document.getElementById('sessionid').value;
                    queueAvatarBubble(notFoundText);
                    stopAlwaysOnListening();

                    await fetch('/human', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: notFoundText,
                            type: 'echo',
                            interrupt: true,
                            sessionid: String(sessionid)
                        })
                    });
                }
            } catch (e) {
                ERR('Error al procesar código de barras:', e);
            } finally {
                const inp = document.getElementById('barcode-input');
                if (inp) inp.focus();
            }
        }

        function showProductCard(prod) {
            const container = document.getElementById('product-card-container');
            if (!container) return;

            clearTimeout(_cardDismissTimeout);
            container.innerHTML = '';

            const isOffer = prod.oferta === 'SI' && prod.precio_oferta;
            const mainPrice = isOffer ? prod.precio_oferta : prod.precio;

            const tagsHtml = (prod.etiquetas || []).map(t => {
                return `<span class="product-tag-pill">${t}</span>`;
            }).join('');

            const pisoTxt = prod.piso ? `Piso ${prod.piso}` : 'Piso 1';
            const pasilloTxt = prod.pasillo ? ` · ${prod.pasillo}` : '';

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-card-badge">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                        <path d="M2 4h2v16H2V4zm4 0h1v16H6V4zm3 0h2v16H9V4zm4 0h1v16h-1V4zm3 0h2v16h-2V4zm4 0h1v16h-1V4z"/>
                    </svg>
                    <span>CÓDIGO: ${prod.codigo_barra || prod.sku}</span>
                </div>
                <div class="product-card-title">${prod.nombre}</div>

        LOG('Modo ASR: SpeechRecognition');

        // ─── Estado UI ─────────────────────────────────────────────────────────────
        function setState(state, text) {
            LOG(`setState → ${state}: "${text}"`);
            document.body.className = 'state-' + state;
            document.getElementById('status-text').textContent = text;
        }

        function setUserText(text, dim = false) {

            const span = document.getElementById('user-text');

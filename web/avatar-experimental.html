<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente Virtual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #6366f1;
            --accent-glow: #818cf8;
            --accent-dim: #4338ca;
            --danger: #ef4444;
            --bg: #09090b;
            --surface: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f4f4f5;
            --text-muted: #71717a;
            --radius: 16px;
            /* mic verde */
            --mic-green: #22c55e;
            --mic-green-dim: #15803d;
            --mic-green-glow: rgba(34, 197, 94, 0.55);
        }

        html,
        body {
            height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        /* ── Fullscreen wrapper ──────────────────────────────── */
        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* ── Avatar ocupa toda la pantalla ──────────────────── */
        #avatar-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--surface);
        }

        #video {
            width: 100%;
            height: 100%;
            /* position: absolute;
            top: 25%; */
            object-fit: contain;
            /* muestra el avatar completo sin recortar */
            object-position: center center;
            display: block;
            background: #000;
        }

        /* Gradient overlay at bottom (para legibilidad del mic) */
        #avatar-wrap::after {
            content: '';
            position: absolute;
            inset: auto 0 0 0;
            height: 30%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
            pointer-events: none;
        }

        /* Speaking indicator (ring desactivado) */
        #speaking-ring {
            display: none;
        }

        /* ── Status badge ───────────────────────────────────── */
        #status-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
            white-space: nowrap;
            transition: opacity 0.3s;
        }

        #status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
            flex-shrink: 0;
        }

        /* Status variants */
        body.state-connecting #status-dot {
            background: #f59e0b;
            animation: dot-blink 1s ease-in-out infinite;
        }

        body.state-ready #status-dot {
            background: #22c55e;
        }

        body.state-listening #status-dot {
            background: var(--accent-glow);
            animation: dot-blink 0.6s ease-in-out infinite;
        }

        body.state-processing #status-dot {
            background: #f59e0b;
            animation: dot-blink 0.4s linear infinite;
        }

        body.state-speaking #status-dot {
            background: #22c55e;
            animation: dot-blink 0.8s ease-in-out infinite;
        }

        @keyframes dot-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        /* ── Transcript overlay (sobre el video, arriba-izquierda) */
        #transcript-wrap {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: min(500px, 88vw);
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }

        .transcript-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadein 0.3s ease;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transcript-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
            flex-shrink: 0;
            width: 32px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .transcript-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
        }

        .transcript-text.dim {
            color: var(--text-muted);
        }

        

        /* ── Botón MIC: oculto en modo always-on wake-word ─────────── */
        #btn-mic {
            display: none !important;
        }

        /* ── Botón conectar (top-left, discreto) ────────────── */
        #btn-connect {
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 30;

            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(24, 24, 27, 0.70);
            backdrop-filter: blur(8px);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #btn-connect:hover {
            background: rgba(39, 39, 42, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text);
        }

        #btn-connect.connected {
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        /* ── Botón PANTALLA COMPLETA (esquina sup-derecha, invisible) */
        #btn-fullscreen {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 50;
            width: 56px;
            height: 56px;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0;
            /* invisible */
            -webkit-tap-highlight-color: transparent;
        }

        /* Pequeño hover hint opcional — quítalo si prefieres que sea 100% invisible */
        /* #btn-fullscreen:hover { opacity: 0.15; background: white; border-radius: 0 0 0 8px; } */

        /* ── Tap overlay animation ───────────────────────────── */
        @keyframes tap-pulse {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(99, 102, 241, 0.5), 0 0 0 0 rgba(99, 102, 241, 0.4);
            }

            50% {
                box-shadow: 0 0 50px rgba(99, 102, 241, 0.8), 0 0 0 18px rgba(99, 102, 241, 0);
            }
        }

        /* ── Hidden audio / inputs ──────────────────────────── */
        audio {
            display: none;
        }

        input[type=hidden] {
            display: none;
        }

        /* ── Debug log panel ────────────────────────────────── */
        #dbg-btn {
            position: fixed;
            bottom: 52px;
            right: 20px;
            z-index: 200;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(9, 9, 11, 0.75);
            backdrop-filter: blur(10px);
            color: #f4f4f5;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        #dbg-btn:hover {
            background: rgba(39, 39, 42, 0.9);
        }

        #dbg-panel {
            position: fixed;
            inset: 0;
            z-index: 199;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 11px;
        }

        #dbg-panel.open {
            display: flex;
        }

        #dbg-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        #dbg-toolbar span {
            color: #a1a1aa;
            font-size: 12px;
            font-family: inherit;
        }

        #dbg-clear {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.8);
            color: #f4f4f5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        #dbg-close {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(127, 29, 29, 0.5);
            color: #fca5a5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 8px;
        }

        #dbg-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dbg-entry {
            display: flex;
            gap: 8px;
            line-height: 1.5;
            word-break: break-all;
        }

        .dbg-ts {
            color: #52525b;
            flex-shrink: 0;
        }

        .dbg-log .dbg-msg {
            color: #d4d4d8;
        }

        .dbg-warn .dbg-msg {
            color: #fbbf24;
        }

        .dbg-err .dbg-msg {
            color: #f87171;
        }

        .dbg-label-log {
            color: #6366f1;
            font-weight: 600;
            flex-shrink: 0;
        }

        .dbg-label-warn {
            color: #f59e0b;
            font-weight: 600;
            flex-shrink: 0;
        }

        .dbg-label-err {
            color: #ef4444;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* Fila de selector de mic */
        #dbg-mic-row {
            padding: 8px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        #dbg-mic-row label {
            color: #a1a1aa;
            font-size: 11px;
            font-family: inherit;
            flex-shrink: 0;
        }

        #dbg-mic-select {
            flex: 1;
            min-width: 160px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.9);
            color: #f4f4f5;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        #dbg-mic-refresh {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(39, 39, 42, 0.8);
            color: #f4f4f5;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        

        

        

        

        /* ── Responsividad en dispositivos móviles y tabletas ── */
        @media (max-width: 768px) {
            /* Video cubre toda la pantalla en móviles, recortando lados si el video es horizontal */
            #video {
                object-fit: cover;
            }

            /* Botón de conectar más accesible al tacto */
            #btn-connect {
                top: 16px;
                left: 16px;
                height: 36px;
                padding: 0 16px;
                font-size: 13px;
                gap: 6px;
                border-radius: 12px;
            }
            #btn-connect svg {
                width: 12px;
                height: 12px;
            }

            /* Indicador de estado más visible */
            #status-badge {
                top: 16px;
                font-size: 13px;
                padding: 8px 16px;
            }

            /* Transcripción más legible */
            #transcript-wrap {
                bottom: 48px;
                width: 90vw;
            }
            .transcript-text {
                font-size: 15px;
            }
            .transcript-label {
                font-size: 11px;
                width: 36px;
            }

            /* Panel de depuración móvil */
            #dbg-panel {
                padding-bottom: 20px;
            }
            #dbg-toolbar span {
                font-size: 14px;
            }
            #dbg-clear, #dbg-close {
                padding: 6px 14px;
                font-size: 12px;
            }
            #dbg-mic-row, 
            #dbg-mic-select, 
            #dbg-list {
                font-size: 12px;
            }
        }

        /* ── Burbujas de chat sobrepuestas ── */
        #chat-container {
            position: absolute;
            left: 20px;
            bottom: 140px;
            width: min(350px, 85vw);
            max-height: 40vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 25;
            pointer-events: auto;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.45;
            max-width: 85%;
            word-break: break-word;
            animation: bubble-appear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: rgba(24, 24, 27, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f4f4f5;
        }
        .chat-bubble.user {
            align-self: flex-end;
            background: rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.4);
            color: #e0e7ff;
        }
        .chat-bubble.avatar {
            align-self: flex-start;
        }
        .chat-bubble.system {
            align-self: center;
            background: rgba(24, 24, 27, 0.35);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 12px;
            text-align: center;
            font-style: italic;
            box-shadow: none;
            max-width: 90%;
        }
        @keyframes bubble-appear {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-bubble.fade-out {
            animation: bubble-fadeout 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes bubble-fadeout {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-10px) scale(0.95); max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; border-top-width: 0; border-bottom-width: 0; opacity: 0; }
        }
    
        /* ── Tarjeta de Producto (Escáner de Código de Barras) ── */
        #product-card-container {
            position: absolute;
            right: 30px;
            bottom: 120px;
            z-index: 40;
            width: min(380px, 90vw);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card {
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.35);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 18px 20px;
            color: #f4f4f5;
            animation: card-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card-badge {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(67, 56, 202, 0.4));
            border: 1px solid rgba(129, 140, 248, 0.4);
            color: #c7d2fe;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-card-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
        }

        .product-card-category {
            font-size: 12px;
            color: #a1a1aa;
            margin-top: -4px;
        }

        .product-card-prices {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-top: 4px;
        }

        .product-card-price-main {
            font-size: 24px;
            font-weight: 800;
            color: #34d399;
            text-shadow: 0 2px 10px rgba(52, 211, 153, 0.3);
        }

        .product-card-price-regular {
            font-size: 15px;
            color: #a1a1aa;
            text-decoration: line-through;
        }

        .product-card-offer-tag {
            background: #ef4444;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            animation: offer-pulse 1.5s ease-in-out infinite;
        }

        @keyframes offer-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .product-card-aisle {
            background: rgba(39, 39, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 2px;
        }

        .product-tag-pill {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d4d4d8;
        }

        .product-tag-pill.tag-azucar { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
        .product-tag-pill.tag-gluten { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.4); color: #fde68a; }
        .product-tag-pill.tag-singluten { background: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.4); color: #86efac; }
        .product-tag-pill.tag-sal { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.4); color: #bfdbfe; }

        @keyframes card-appear {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .product-card.fade-out {
            animation: card-fadeout 0.5s ease forwards;
        }

        @keyframes card-fadeout {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }
    </style>

</head>

<body class="state-connecting">

    <!-- Elementos requeridos por client.js -->
    <input type="hidden" id="sessionid" value="0">
    <audio id="audio" autoplay></audio>
    <input type="checkbox" id="use-stun" style="display:none">
    <button id="start" style="display:none"></button>
    <button id="stop" style="display:none"></button>

    
    <!-- Input Oculto para Lector de Código de Barras (Escáner USB/Bluetooth) -->
    <input type="text" id="barcode-input" autocomplete="off" style="position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; top: -100px; left: -100px;" aria-hidden="true" />

    <!-- Contenedor para Tarjetas de Producto por Escaneo -->
    <div id="product-card-container"></div>

    <div id="app">

        <!-- Avatar fullscreen -->
        <div id="avatar-wrap">
            <video id="video" autoplay playsinline muted></video>
            <!-- Burbujas de chat sobrepuestas -->
            <div id="chat-container"></div>
            <div id="speaking-ring"></div>

            <!-- Status badge (arriba-centro) -->
            <div id="status-badge">
                <div id="status-dot"></div>
                <span id="status-text">Conectando…</span>
            </div>

            <!-- Transcript (sobre video, encima del mic) -->
            <div id="transcript-wrap">
                <div id="user-line" class="transcript-line" style="display:none">
                    <span class="transcript-label">Tú</span>
                    <span id="user-text" class="transcript-text dim"></span>
                </div>
            </div>

            

            <!-- Botón conectar (discreto, bottom-left) -->
            <button id="btn-connect" onclick="connectRTC()">
                <svg viewBox="0 0 20 20" fill="currentColor" width="9" height="9">
                    <path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 14.5A6.5 6.5 0 1110 3.5a6.5 6.5 0 010 13z" />
                    <path
                        d="M10 6a1 1 0 011 1v3.586l2.707 2.707a1 1 0 01-1.414 1.414l-3-3A1 1 0 019 11V7a1 1 0 011-1z" />
                </svg>
                Conectar
            </button>

            <!-- Botón invisible fullscreen (esquina sup-derecha) -->
            <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Pantalla completa"
                aria-label="Pantalla completa"></button>

            <!-- Botón debug log (bottom-right) -->
            <button id="dbg-btn" onclick="dbgToggle()" title="Ver logs">🪲</button>

            <!-- Overlay tap-to-start (Android / mobile autoplay fix) -->
            <div id="tap-overlay" onclick="handleTapToStart()" style="
            position:absolute; inset:0; z-index:100;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:16px;
            background:rgba(0,0,0,0.72); cursor:pointer;
        ">
                <div style="
                width:80px; height:80px; border-radius:50%;
                background:linear-gradient(135deg,#6366f1,#4338ca);
                display:flex; align-items:center; justify-content:center;
                box-shadow:0 0 40px rgba(99,102,241,0.6);
                animation: tap-pulse 2s ease-in-out infinite;
            ">
                    <!-- Play icon -->
                    <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </div>
                <p style="color:#f4f4f5;font-size:15px;font-weight:500;margin:0;text-shadow:0 2px 8px rgba(0,0,0,0.8);">
                    Toca para iniciar</p>
            </div>

        </div>
    </div>

    <!-- Debug log panel (tap 🪲 to open) -->
    <div id="dbg-panel">
        <div id="dbg-toolbar">
            <span>🪲 Consola de depuración</span>
            <div style="display:flex;gap:4px">
                <button id="dbg-clear" onclick="dbgClear()">Limpiar</button>
                <button id="dbg-close" onclick="dbgToggle()">Cerrar ✕</button>
            </div>
        </div>
        <!-- Selector de micrófono -->
        <div id="dbg-mic-row">
            <label>🎤 Micrófono:</label>
            <select id="dbg-mic-select" onchange="dbgSelectMic(this.value)">
                <option value="">-- default del sistema --</option>
            </select>
            <button id="dbg-mic-refresh" onclick="dbgLoadDevices()">&#8635; Actualizar</button>
        </div>
        
        <div id="dbg-list"></div>
    </div>

    <!-- WebRTC client -->
    <script src="client.js"></script>

    <script>
        // ══════════════════════════════════════════════════════════════════════════════
        // DEBUG LOGGER — escribe en consola del navegador Y en el panel on-screen 🪲
        // ══════════════════════════════════════════════════════════════════════════════
        const _DBG_MAX = 200;

        function _dbgWrite(level, args) {
            if (level === 'log') console.log('[Avatar]', ...args);
            if (level === 'warn') console.warn('[Avatar]', ...args);
            if (level === 'err') console.error('[Avatar]', ...args);

            const list = document.getElementById('dbg-list');
            if (!list) return;

            const now = new Date();
            const ts = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.${String(now.getMilliseconds()).padStart(3, '0')}`;
            const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');

            const entry = document.createElement('div');
            entry.className = `dbg-entry dbg-${level}`;
            entry.innerHTML =
                `<span class="dbg-ts">${ts}</span>` +
                `<span class="dbg-label-${level}">${level.toUpperCase()}</span>` +
                `<span class="dbg-msg">${msg.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`;
            list.appendChild(entry);

            while (list.children.length > _DBG_MAX) list.removeChild(list.firstChild);

            const panel = document.getElementById('dbg-panel');
            if (panel && panel.classList.contains('open')) {
                list.scrollTop = list.scrollHeight;
            }
        }

        const LOG = (...args) => _dbgWrite('log', args);
        const WARN = (...args) => _dbgWrite('warn', args);
        const ERR = (...args) => _dbgWrite('err', args);

        function dbgToggle() {
            const panel = document.getElementById('dbg-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                const list = document.getElementById('dbg-list');
                list.scrollTop = list.scrollHeight;
            }
        }

        function dbgClear() {
            const list = document.getElementById('dbg-list');
            list.innerHTML = '';
            LOG('Consola limpiada');
        }

        // ─── Selector de micrófono en panel debug ─────────────────────────────────
        let _preferredDeviceId = null;

        async function dbgLoadDevices() {
            const sel = document.getElementById('dbg-mic-select');
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                WARN('enumerateDevices no disponible en este dispositivo');
                return;
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                LOG(`Micrófonos disponibles: ${audioInputs.length}`);
                audioInputs.forEach((d, i) => {
                    LOG(`  [${i}] id="${d.deviceId.slice(0, 16)}…" label="${d.label || '(sin permiso)'}"`);
                });

                if (sel) {
                    sel.innerHTML = '<option value="">-- default del sistema --</option>';
                    audioInputs.forEach((d, i) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label
                            ? d.label
                            : `Micrófono ${i + 1}  (${d.deviceId.slice(0, 8)}…)`;
                        if (d.deviceId === _preferredDeviceId) opt.selected = true;
                        sel.appendChild(opt);
                    });
                }

                if (audioInputs.length === 0) ERR('¡No se encontraron micrófonos!');
            } catch (e) {
                ERR('dbgLoadDevices error:', e.name, e.message);
            }
        }

        function dbgSelectMic(deviceId) {
            _preferredDeviceId = deviceId || null;
            if (_preferredDeviceId) {
                const sel = document.getElementById('dbg-mic-select');
                const label = sel?.options[sel.selectedIndex]?.textContent || deviceId;
                LOG(`🎤 Micrófono seleccionado: "${label}"`);
            } else {
                LOG('🎤 Micrófono: default del sistema');
            }
        }

        LOG('=== INIT ===');
        LOG('UA:', navigator.userAgent);
        LOG('Secure context:', window.isSecureContext);
        LOG('SpeechRecognition:', !!(window.SpeechRecognition || window.webkitSpeechRecognition));
        LOG('getUserMedia:', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
        LOG('Protocol:', location.protocol, '| Host:', location.host);

        // ─── Estado ────────────────────────────────────────────────────────────────
        let isConnected = false;
        let isListening = false;
        let recognition = null;
        let isSpeaking = false;
        let speakCheckInterval = null;
        let _audioUnlocked = false;

        // ─── Wake-word & Modo Conversación Abierta (Experimental) ───────────────
        const WAKE_WORDS = ['hola', 'oye', 'disculpa', 'permiso', 'necesito ayuda', 'asistente', 'buenas'];
        const WAKE_WORD = WAKE_WORDS[0];

        let _wakeDetected = false;
        let _alwaysOnActive = false;

        let _conversationAwake = false;  // true si el flujo de conversación está activo sin requerir wake-word
        let _inactivityTimeoutId = null; // temporizador de inactividad
        let _followUpTimeoutId = null;   // ID del temporizador para preguntar si necesita algo más
        let _waitingFollowUpAck = false;  // true cuando se preguntó "¿Necesitas algo más?" y esperamos respuesta
        let _followUpAckTimeoutId = null; // timer del segundo wait de 30s tras "¿Necesitas algo más?"
        let _pendingAvatarBubbleText = null;    // Texto de respuesta del LLM en cola para mostrar cuando empiece a hablar
        let _pendingAvatarBubbleTimeout = null; // Timeout de seguridad para la burbuja en cola
        const INACTIVITY_TIMEOUT_MS = 120000;   // 2 minutos antes de volver a modo de espera

        const BUFFER_MS = 5000;                 // ms de espera para pregunta tras la wake-word
        let _wakeBufferTimeout = null;

        const WAKE_ONLY_GREETINGS = [
            '¡Hola! ¿En qué te puedo ayudar?',
            '¡Buenas! ¿Buscas algo en especial?',
            '¡Hola! ¿Necesitas ayuda para encontrar algo?',
            'Aquí estoy, ¿en qué te ayudo?'
        ];

        function _randomGreeting() {
            return WAKE_ONLY_GREETINGS[Math.floor(Math.random() * WAKE_ONLY_GREETINGS.length)];
        }

        function _containsWakeWord(text) {
            const lower = text.toLowerCase();
            return WAKE_WORDS.some(w => lower.includes(w));
        }

        function _extractQuestion(text) {
            const lower = text.toLowerCase();
            let best = { idx: -1, word: '' };
            for (const w of WAKE_WORDS) {
                const i = lower.indexOf(w);
                if (i !== -1 && (best.idx === -1 || i < best.idx)) {
                    best = { idx: i, word: w };
                }
            }
            if (best.idx === -1) return text.trim();
            return text.slice(best.idx + best.word.length).replace(/^[,\.\s¿¡]+/, '').trim();
        }

        function _isSleepWord(text) {
            const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?¡!]/g,"");
            const sleepWords = ['no', 'gracias', 'chao', 'adios', 'nada mas', 'ninguna', 'ninguno', 'hasta luego', 'eso es todo', 'no gracias', 'nos vemos', 'que estes bien', 'chao chao', 'bye'];
            return sleepWords.some(w => clean === w || clean === w + ' ' || clean.startsWith(w + ' '));
        }

        function clearServerHistory() {
            const sessionid = document.getElementById('sessionid').value;
            LOG('Borrando historial de conversación en servidor para sesión:', sessionid);
            fetch('/clear_history', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionid: String(sessionid) })
            }).catch(e => WARN('clearServerHistory error:', e));
        }

        function sleepModel(showBubble = false) {
            LOG("Durmiendo el modelo experimental (conversación cerrada).");
            _conversationAwake = false;
            _wakeDetected = false;
            _waitingFollowUpAck = false;
            clearTimeout(_inactivityTimeoutId);
            clearTimeout(_followUpTimeoutId);
            clearTimeout(_followUpAckTimeoutId);
            clearServerHistory();
            setState('listening', 'Esperando activación…');
            if (showBubble) {
                addChatBubble('system', 'Conversación finalizada. Di "Hola" para activar de nuevo.');
            }
        }

        function wakeUpModel() {
            if (!_conversationAwake) {
                LOG("Despertando el modelo experimental (conversación abierta).");
                _conversationAwake = true;
                const container = document.getElementById('chat-container');
                if (container) container.innerHTML = '';
            }
            resetInactivityTimer();
        }

        function resetInactivityTimer() {
            clearTimeout(_inactivityTimeoutId);
            if (!_conversationAwake) return;
            _inactivityTimeoutId = setTimeout(() => {
                LOG("Sesión inactiva por 2 minutos. Volviendo a modo de espera de wake-word.");
                _conversationAwake = false;
                _wakeDetected = false;
                setState('listening', 'Esperando activación…');
                clearServerHistory();
                const container = document.getElementById('chat-container');
                if (container) container.innerHTML = '';
            }, INACTIVITY_TIMEOUT_MS);
        }

        function addChatBubble(role, text) {
            const container = document.getElementById('chat-container');
            if (!container) return;

            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role}`;
            bubble.textContent = text;
            container.appendChild(bubble);

            container.scrollTop = container.scrollHeight;

            while (container.children.length > 5) {
                container.removeChild(container.firstChild);
            }

            setTimeout(() => {
                bubble.classList.add('fade-out');
                setTimeout(() => {
                    if (bubble.parentNode) {
                        bubble.parentNode.removeChild(bubble);
                    }
                }, 500);
            }, 30000);

            return bubble;
        }

        function queueAvatarBubble(text) {
            clearTimeout(_pendingAvatarBubbleTimeout);
            _pendingAvatarBubbleText = text;
            
            if (isSpeaking) {
                addChatBubble('avatar', _pendingAvatarBubbleText);
                _pendingAvatarBubbleText = null;
                return;
            }
            
            _pendingAvatarBubbleTimeout = setTimeout(() => {
                if (_pendingAvatarBubbleText) {
                    addChatBubble('avatar', _pendingAvatarBubbleText);
                    _pendingAvatarBubbleText = null;
                }
            }, 4000);
        }

        function scheduleFollowUp() {
            // Si ya preguntamos "¿Necesitas algo más?" y esperamos respuesta,
            // NO reprogramar — eso causaría el bucle infinito de preguntas.
            if (_waitingFollowUpAck) {
                LOG('scheduleFollowUp: ya esperando ACK del follow-up, no reprogramar.');
                return;
            }
            clearTimeout(_followUpTimeoutId);
            clearTimeout(_followUpAckTimeoutId);
            if (!_conversationAwake) return;
            _followUpTimeoutId = setTimeout(() => {
                LOG("15 segundos de silencio → Preguntando si necesita algo más.");
                const followUpText = "¿Necesitas algo más?";
                _waitingFollowUpAck = true;
                
                queueAvatarBubble(followUpText);
                stopAlwaysOnListening();
                
                const sessionid = document.getElementById('sessionid').value;
                fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: followUpText,
                        type: 'echo',
                        sessionid: String(sessionid)
                    })
                }).catch(e => WARN('Error al enviar follow-up:', e));
            }, 15000);
        }

        function scheduleFollowUpAckTimeout() {
            clearTimeout(_followUpAckTimeoutId);
            if (!_waitingFollowUpAck || !_conversationAwake) return;
            LOG('scheduleFollowUpAckTimeout: esperando 15s respuesta al follow-up…');
            _followUpAckTimeoutId = setTimeout(() => {
                if (!_waitingFollowUpAck) return;
                LOG('15s sin respuesta al follow-up → enviando despedida final y durmiendo.');
                _waitingFollowUpAck = false;
                const farewellText = "Muy bien, si necesitas algo más no dudes en llamarme. ¡Que tengas un excelente día!";
                queueAvatarBubble(farewellText);
                stopAlwaysOnListening();
                clearServerHistory();
                _conversationAwake = false;
                _wakeDetected = false;
                clearTimeout(_inactivityTimeoutId);
                clearTimeout(_followUpTimeoutId);
                const sessionid = document.getElementById('sessionid').value;
                fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: farewellText,
                        type: 'echo',
                        sessionid: String(sessionid)
                    })
                }).then(() => {
                    addChatBubble('system', 'Conversación finalizada. Di "Hola" para activar de nuevo.');
                    setState('listening', 'Esperando activación…');
                }).catch(e => WARN('Error al enviar despedida final:', e));
            }, 15000);
        }

        // ─── Lector de Código de Barras (Módulo 1) ──────────────────────────────────
        let _cardDismissTimeout = null;

        function keepBarcodeFocus() {
            const inp = document.getElementById('barcode-input');
            if (!inp) return;
            const dbgPanel = document.getElementById('dbg-panel');
            if (dbgPanel && dbgPanel.classList.contains('open')) return;
            if (document.activeElement !== inp) {
                inp.focus();
            }
        }

        async function handleBarcodeScan(code) {
            LOG(`Escáner de código de barras detectado: "${code}"`);
            try {
                const res = await fetch(`/api/producto/barcode/${encodeURIComponent(code)}`);
                const result = await res.json();

                if (result.code === 0 && result.data) {
                    const prod = result.data;
                    LOG('Producto encontrado:', prod.nombre);
                    showProductCard(prod);

                    // ── Construir mensaje de contexto para el LLM ──────────────────────────
                    // Incluye TODO (nombre, precio, oferta, pasillo) para que el LLM lo recuerde
                    // en el historial, pero el SYSTEM_PROMPT le indica que NO mencione el pasillo
                    // hasta que el cliente lo pida.
                    let llmContextMsg = `Producto escaneado: ${prod.nombre}. `;
                    llmContextMsg += `Precio regular: ${prod.precio.toLocaleString('es-CL')} pesos. `;
                    if (prod.oferta === 'SI' && prod.precio_oferta) {
                        llmContextMsg += `En oferta a ${prod.precio_oferta.toLocaleString('es-CL')} pesos. `;
                    } else {
                        llmContextMsg += `Sin oferta. `;
                    }
                    llmContextMsg += `Pasillo: ${prod.pasillo}.`;

                    const sessionid = document.getElementById('sessionid').value;

                    // Cancelar cualquier follow-up pendiente ANTES de procesar el escaneo.
                    // Sin esto, si el timer de "¿Necesitas algo más?" dispara justo durante
                    // el escaneo, el avatar lee ambos mensajes seguidos.
                    clearTimeout(_followUpTimeoutId);
                    clearTimeout(_followUpAckTimeoutId);
                    _waitingFollowUpAck = false;

                    // Limpiar historial previo para que el nuevo producto sea el contexto principal
                    clearServerHistory();

                    // Despertar la conversación si no estaba activa
                    wakeUpModel();

                    stopAlwaysOnListening();

                    // Enviar al LLM como 'chat' — el LLM dirá precio/oferta y preguntará por ubicación
                    const llmRes = await fetch('/human', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: llmContextMsg,
                            type: 'chat',
                            interrupt: true,
                            stream: true,
                            sessionid: String(sessionid)
                        })
                    });

                    // Leer el stream para mostrar la burbuja del avatar en tiempo real
                    if (llmRes.body) {
                        const reader = llmRes.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let fullText = '';
                        let avatarBubble = null;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            const chunk = decoder.decode(value, { stream: true });
                            fullText += chunk;
                            if (!avatarBubble && fullText.trim()) {
                                avatarBubble = addChatBubble('avatar', '');
                            }
                            if (avatarBubble) {
                                avatarBubble.textContent = fullText;
                                const container = document.getElementById('chat-container');
                                if (container) container.scrollTop = container.scrollHeight;
                            }
                        }
                        LOG('handleBarcodeScan: respuesta LLM completa:', fullText);
                    }

                } else {
                    WARN(`Producto no encontrado para el código: ${code}`);
                    showProductNotFound(code);

                    const notFoundText = `Lo siento, no encontré ningún producto registrado con ese código de barras.`;
                    const sessionid = document.getElementById('sessionid').value;
                    queueAvatarBubble(notFoundText);
                    stopAlwaysOnListening();

                    await fetch('/human', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: notFoundText,
                            type: 'echo',
                            interrupt: true,
                            sessionid: String(sessionid)
                        })
                    });
                }
            } catch (e) {
                ERR('Error al procesar código de barras:', e);
            } finally {
                const inp = document.getElementById('barcode-input');
                if (inp) inp.focus();
            }
        }

        function showProductCard(prod) {
            const container = document.getElementById('product-card-container');
            if (!container) return;

            clearTimeout(_cardDismissTimeout);
            container.innerHTML = '';

            const isOffer = prod.oferta === 'SI' && prod.precio_oferta;
            const mainPrice = isOffer ? prod.precio_oferta : prod.precio;

            const tagsHtml = (prod.etiquetas || []).map(t => {
                let tagClass = '';
                const lower = t.toLowerCase();
                if (lower.includes('azucar')) tagClass = 'tag-azucar';
                else if (lower.includes('sin gluten')) tagClass = 'tag-singluten';
                else if (lower.includes('gluten')) tagClass = 'tag-gluten';
                else if (lower.includes('sal') || lower.includes('sodio')) tagClass = 'tag-sal';
                return `<span class="product-tag-pill ${tagClass}">${t}</span>`;
            }).join('');

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-card-badge">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                        <path d="M2 4h2v16H2V4zm4 0h1v16H6V4zm3 0h2v16H9V4zm4 0h1v16h-1V4zm3 0h2v16h-2V4zm4 0h1v16h-1V4z"/>
                    </svg>
                    <span>CÓDIGO: ${prod.codigo_barra}</span>
                </div>
                <div class="product-card-title">${prod.nombre}</div>
                <div class="product-card-category">${prod.categoria}</div>
                <div class="product-card-prices">
                    <span class="product-card-price-main">$${mainPrice.toLocaleString('es-CL')}</span>
                    ${isOffer ? `<span class="product-card-price-regular">$${prod.precio.toLocaleString('es-CL')}</span>` : ''}
                    ${isOffer ? `<span class="product-card-offer-tag">OFERTA</span>` : ''}
                </div>
                <div class="product-card-aisle">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                        <circle cx="12" cy="9" r="2.5"/>
                    </svg>
                    <span>${prod.pasillo}</span>
                </div>
                ${tagsHtml ? `<div class="product-card-tags">${tagsHtml}</div>` : ''}
            `;

            container.appendChild(card);

            _cardDismissTimeout = setTimeout(() => {
                card.classList.add('fade-out');
                setTimeout(() => {
                    if (card.parentNode) card.parentNode.removeChild(card);
                }, 500);
            }, 15000);
        }

        function showProductNotFound(code) {
            const container = document.getElementById('product-card-container');
            if (!container) return;

            clearTimeout(_cardDismissTimeout);
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'product-card';
            card.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            card.innerHTML = `
                <div class="product-card-badge" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;">
                    <span>NO ENCONTRADO</span>
                </div>
                <div class="product-card-title" style="font-size: 15px;">Código ${code} no registrado</div>
                <div style="font-size: 12px; color: #a1a1aa;">Verifique que el producto esté ingresado en el sistema.</div>
            `;

            container.appendChild(card);

            _cardDismissTimeout = setTimeout(() => {
                card.classList.add('fade-out');
                setTimeout(() => {
                    if (card.parentNode) card.parentNode.removeChild(card);
                }, 500);
            }, 8000);
        }

        LOG('Modo ASR: SpeechRecognition');

        // ─── Estado UI ─────────────────────────────────────────────────────────────
        function setState(state, text) {
            LOG(`setState → ${state}: "${text}"`);
            document.body.className = 'state-' + state;
            document.getElementById('status-text').textContent = text;
        }

        function setUserText(text, dim = false) {
            const line = document.getElementById('user-line');
            const span = document.getElementById('user-text');
            line.style.display = text ? 'flex' : 'none';
            span.textContent = text;
            span.className = 'transcript-text' + (dim ? ' dim' : '');
        }

        // ─── Pantalla completa ─────────────────────────────────────────────────────
        function toggleFullscreen() {
            LOG('toggleFullscreen llamado');
            const el = document.documentElement;
            if (!document.fullscreenElement &&
                !document.webkitFullscreenElement &&
                !document.mozFullScreenElement) {
                const req = el.requestFullscreen
                    || el.webkitRequestFullscreen
                    || el.mozRequestFullScreen
                    || el.msRequestFullscreen;
                if (req) req.call(el).catch(e => WARN('Fullscreen error:', e));
            } else {
                const exit = document.exitFullscreen
                    || document.webkitExitFullscreen
                    || document.mozCancelFullScreen
                    || document.msExitFullscreen;
                if (exit) exit.call(document);
            }
        }

        // ─── Tap-to-start (Android autoplay fix) ──────────────────────────────────
        function handleTapToStart() {
            LOG('handleTapToStart — tap del usuario detectado');
            const overlay = document.getElementById('tap-overlay');
            if (overlay) overlay.style.display = 'none';

            const videoEl = document.getElementById('video');
            videoEl.muted = false;
            _audioUnlocked = true;
            LOG('Video desmutado dentro del gesto de usuario');

            if (videoEl.srcObject) {
                videoEl.play()
                    .then(() => LOG('video.play() OK tras tap'))
                    .catch(e => WARN('video.play() rechazado tras tap:', e.name, e.message));
            }

            connectRTC();
        }

        // ─── WebRTC ────────────────────────────────────────────────────────────────
        function connectRTC() {
            if (isConnected) { LOG('connectRTC: ya conectado, ignorando'); return; }
            LOG('connectRTC: iniciando...');
            setState('connecting', 'Conectando…');
            start();   // client.js
            document.getElementById('btn-connect').textContent = '✓ Conectado';
            document.getElementById('btn-connect').classList.add('connected');
            isConnected = true;

            const _v = document.getElementById('video');
            let _vChecks = 0;
            const _vTimer = setInterval(function () {
                _vChecks++;
                if (_v.srcObject) {
                    if (_v.paused) {
                        _v.muted = true;
                        _v.play()
                            .then(function () { LOG('video.play() OK muted'); clearInterval(_vTimer); })
                            .catch(function (e) { WARN('video.play() muted fallo:', e.name); clearInterval(_vTimer); });
                    } else {
                        LOG('Video reproduciendo');
                        clearInterval(_vTimer);
                    }
                } else if (_vChecks > 30) {
                    WARN('15s sin stream en el video.');
                    clearInterval(_vTimer);
                }
            }, 500);
            setTimeout(() => {
                startSpeakingMonitor();
                LOG('Monitor de speaking activo — iniciando always-on listening');
                startAlwaysOnListening();
            }, 2500);
        }

        // ─── Monitor de "avatar hablando" ──────────────────────────────────────────
        // Watchdog: si el avatar lleva más de MAX_SPEAKING_MS en estado "hablando"
        // sin que el backend reporte speaking=false (fallo de red / latencia), lo resetea.
        const MAX_SPEAKING_MS = 45000; // 45 segundos máximo hablando
        let _speakingStartMs = 0;
        let _speakingWatchdog = null;

        function _clearSpeakingWatchdog() {
            clearTimeout(_speakingWatchdog);
            _speakingWatchdog = null;
        }

        function _armSpeakingWatchdog() {
            _clearSpeakingWatchdog();
            _speakingStartMs = Date.now();
            _speakingWatchdog = setTimeout(() => {
                if (isSpeaking) {
                    WARN(`[Speaking Watchdog] Avatar en estado "hablando" por más de ${MAX_SPEAKING_MS / 1000}s sin fin reportado. Forzando reset.`);
                    isSpeaking = false;
                    const wrap = document.getElementById('avatar-wrap');
                    if (wrap) wrap.classList.remove('avatar-speaking');
                    if (_conversationAwake) {
                        setState('listening', 'Escuchando pregunta…');
                        scheduleFollowUp();
                    } else {
                        setState('listening', 'Esperando activación…');
                    }
                    setTimeout(() => {
                        if (!isListening && !_alwaysOnActive) startAlwaysOnListening();
                    }, 600);
                }
            }, MAX_SPEAKING_MS);
        }

        function startSpeakingMonitor() {
            LOG('startSpeakingMonitor iniciado');
            speakCheckInterval = setInterval(async () => {
                if (!isConnected) return;
                try {
                    const sessionid = document.getElementById('sessionid').value;
                    const res = await fetch('/is_speaking', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionid })
                    });
                    const data = await res.json();
                    const speaking = data.data;
                    if (speaking !== isSpeaking) {
                        isSpeaking = speaking;
                        LOG('isSpeaking cambió →', speaking);
                        const wrap = document.getElementById('avatar-wrap');
                        if (speaking) {
                            wrap.classList.add('avatar-speaking');
                            setState('speaking', 'Hablando…');
                            _armSpeakingWatchdog(); // iniciar watchdog al comenzar a hablar
                            if (_pendingAvatarBubbleText) {
                                clearTimeout(_pendingAvatarBubbleTimeout);
                                addChatBubble('avatar', _pendingAvatarBubbleText);
                                _pendingAvatarBubbleText = null;
                            }
                        } else {
                            wrap.classList.remove('avatar-speaking');
                            _clearSpeakingWatchdog(); // limpiar watchdog al terminar de hablar
                            LOG('Avatar terminó de hablar → reiniciando escucha (awake: ' + _conversationAwake + ')');
                            
                            if (_conversationAwake) {
                                setState('listening', 'Escuchando pregunta…');
                                scheduleFollowUp();
                                if (_waitingFollowUpAck) {
                                    scheduleFollowUpAckTimeout();
                                }
                            } else {
                                setState('listening', 'Esperando activación…');
                            }

                            setTimeout(() => {
                                if (!isListening) {
                                    _alwaysOnActive = false;
                                    startAlwaysOnListening();
                                }
                            }, 600);
                        }
                    }
                } catch (e) {
                    WARN('[Speaking Monitor] Error al consultar is_speaking:', e.message || e);
                }
            }, 500);
        }


        // ─── Solicitud de Permiso de Micrófono ────────────────────────────────────
        async function requestMicPermission() {
            LOG('requestMicPermission: verificando micrófono...');
            if (_preferredDeviceId) LOG(`Usando dispositivo seleccionado: ${_preferredDeviceId.slice(0, 16)}…`);
            try {
                const audioConstraints = _preferredDeviceId
                    ? { deviceId: { exact: _preferredDeviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    : { echoCancellation: true, noiseSuppression: true, autoGainControl: true };

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: audioConstraints,
                    video: false
                });

                const tracks = stream.getAudioTracks();
                tracks.forEach((t, i) => {
                    LOG(`  Track[${i}]: label="${t.label}" readyState=${t.readyState}`);
                    t.stop(); // Liberar track para no bloquear SpeechRecognition
                });

                if (_conversationAwake) {
                    setState('listening', `Escuchando pregunta…`);
                } else {
                    setState('listening', `Esperando activación…`);
                }
                await dbgLoadDevices();

                LOG('Permiso de micrófono OK — Hardware libre para SpeechRecognition');
                return true;
            } catch (e) {
                ERR('requestMicPermission falló:', e.name, e.message);
                if (e.name === 'NotAllowedError') {
                    setState('ready', '⚠ Permiso de micrófono denegado');
                } else if (e.name === 'NotFoundError') {
                    setState('ready', '⚠ No se encontró micrófono');
                } else {
                    setState('ready', '⚠ Error de micrófono: ' + e.name);
                }
                return false;
            }
        }

        // ─── Speech Recognition ────────────────────────────────────────────────────
        let _recStartMs = 0;
        let _gotAnyResult = false;
        let _audioCaptureErrors = 0;
        let _networkSpeechErrors = 0;

        function setupRecognition() {
            LOG('setupRecognition: creando instancia...');
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                ERR('SpeechRecognition NO disponible en este navegador');
                return null;
            }

            const rec = new SpeechRec();
            rec.lang = 'es-CL';
            rec.interimResults = true;
            rec.continuous = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                _recStartMs = Date.now();
                _gotAnyResult = false;
                LOG(`SpeechRecognition.onstart — ESCUCHANDO (awake: ${_conversationAwake})`);
                isListening = true;
                setState('listening', _conversationAwake ? 'Escuchando pregunta…' : 'Esperando activación…');
                setUserText('', false);
            };

            rec.onresult = (event) => {
                _gotAnyResult = true;
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const t = event.results[i][0].transcript;
                    const conf = event.results[i][0].confidence;
                    if (event.results[i].isFinal) {
                        LOG(`Resultado FINAL: "${t}" (confidence=${conf.toFixed(2)})`);
                        final += t;
                    } else {
                        interim += t;
                    }
                }
                if (interim) LOG(`Resultado interim: "${interim}"`);

                const rawText = (final || interim).trim();
                if (!rawText) return;

                if (!_conversationAwake) {
                    if (_containsWakeWord(rawText)) {
                        wakeUpModel();
                        LOG(`Wake-word detectada en: "${rawText}" → Modelo despierto`);
                        setState('listening', 'Escuchando pregunta…');
                        clearTimeout(_wakeBufferTimeout);
                        _wakeBufferTimeout = setTimeout(() => {
                            if (_conversationAwake && !_extractQuestion(rawText)) {
                                LOG('Buffer expirado sin pregunta → enviando saludo al LLM');
                                sendToLLM(_randomGreeting());
                            }
                        }, BUFFER_MS);
                    } else {
                        setUserText(final || interim, true);
                        return;
                    }
                } else {
                    resetInactivityTimer();
                    clearTimeout(_followUpTimeoutId);
                    clearTimeout(_followUpAckTimeoutId);
                    _waitingFollowUpAck = false;
                }

                setUserText(final || interim, !final);

                if (final) {
                    let question = _extractQuestion(final);
                    if (!question && _containsWakeWord(final)) {
                        question = _randomGreeting();
                    } else if (!question) {
                        question = final.trim();
                    }

                    LOG(`Texto procesado: "${question}" | awake: ${_conversationAwake}`);

                    if (question) {
                        clearTimeout(_wakeBufferTimeout);

                        if (_isSleepWord(question)) {
                            LOG(`Palabra de despedida detectada: "${question}" → durmiendo modelo`);
                            sendToLLM(question, true);
                            sleepModel(true);
                            return;
                        }

                        LOG(`Enviando al LLM: "${question}"`);
                        _alwaysOnActive = false;
                        sendToLLM(question);
                    }
                }
            };

            rec.onerror = (e) => {
                const elapsed = Date.now() - _recStartMs;
                ERR(`SpeechRecognition.onerror — error="${e.error}" elapsed=${elapsed}ms`);

                if (e.error === 'audio-capture') {
                    _audioCaptureErrors++;
                    ERR(`audio-capture #${_audioCaptureErrors}: mic no accesible`);
                    setState('ready', '⚠ Error captura de audio — intenta de nuevo');
                } else if (e.error === 'not-allowed') {
                    ERR('not-allowed: permiso de micrófono denegado');
                    setState('ready', '⚠ Permiso de micrófono denegado');
                } else if (e.error === 'network') {
                    _networkSpeechErrors++;
                    ERR('network error #' + _networkSpeechErrors + ': SpeechRecognition no puede conectar a los servidores de voz.');
                    setState('ready', 'Error de red STT — reintenta o verifica soporte de voz');
                } else if (e.error !== 'no-speech') {
                    setState('ready', `⚠ Error: ${e.error}`);
                } else {
                    LOG('no-speech: timeout normal sin voz');
                }
                stopListening();
            };

            rec.onend = () => {
                const elapsed = Date.now() - _recStartMs;
                LOG(`SpeechRecognition.onend — elapsed=${elapsed}ms, gotResult=${_gotAnyResult}, alwaysOn=${_alwaysOnActive}`);

                if (!_gotAnyResult && elapsed < 1500) {
                    WARN(`Fin rápido sin resultado (${elapsed}ms) → reintentando en 700ms`);
                    stopListening();
                    setTimeout(() => {
                        if (!isListening && _alwaysOnActive) {
                            LOG('Reintento de SpeechRecognition (always-on)...');
                            recognition = setupRecognition();
                            if (recognition) {
                                try { recognition.start(); }
                                catch (ex) { ERR('reintento falló:', ex.name); }
                            }
                        }
                    }, 700);
                    return;
                }

                stopListening();

                if (_alwaysOnActive) {
                    LOG('SpeechRecognition onend: always-on activo → reiniciando en 600ms');
                    setTimeout(() => {
                        if (_alwaysOnActive && !isListening) {
                            startAlwaysOnListening();
                        }
                    }, 600);
                }
            };

            return rec;
        }

        let _stopTimeout = null;
        function forceStopRecognition() {
            if (!recognition) { stopListening(); return; }
            LOG('forceStopRecognition: llamando stop()...');
            recognition.stop();

            clearTimeout(_stopTimeout);
            _stopTimeout = setTimeout(() => {
                if (isListening) {
                    WARN('forceStopRecognition: onend no disparó en 2.5s → abort() forzado');
                    try { recognition.abort(); } catch (e) { LOG('abort() excepción (ignorada):', e.name); }
                    stopListening();
                }
            }, 2500);
        }

        function stopListening() {
            LOG('stopListening');
            isListening = false;
            clearTimeout(_stopTimeout);

            if (!isSpeaking && !_alwaysOnActive) {
                setState('processing', 'Procesando…');
            }
        }

        // ─── Escucha siempre activa con wake-word ────────────────────────────────
        function startAlwaysOnListening() {
            if (!isConnected) {
                LOG('startAlwaysOnListening: avatar no conectado, ignorando');
                return;
            }
            if (isSpeaking) {
                LOG('startAlwaysOnListening: avatar hablando, esperando a que termine');
                return;
            }
            if (isListening) {
                LOG('startAlwaysOnListening: ya escuchando, ignorando');
                return;
            }

            _alwaysOnActive = true;
            LOG(`startAlwaysOnListening: iniciando escucha continua (awake: ${_conversationAwake})`);

            if (_conversationAwake) {
                setState('listening', 'Escuchando pregunta…');
                resetInactivityTimer();
            } else {
                setState('listening', 'Esperando activación…');
            }

            requestMicPermission().then(ok => {
                if (!ok) {
                    LOG('startAlwaysOnListening: sin permiso de micrófono');
                    _alwaysOnActive = false;
                    setState('ready', '⚠ Sin permiso de micrófono');
                    return;
                }

                if (!_audioUnlocked) {
                    const videoEl = document.getElementById('video');
                    videoEl.muted = false;
                    _audioUnlocked = true;
                    if (videoEl.srcObject) {
                        videoEl.play().catch(e => WARN('play() audio unlock error:', e.name));
                    }
                    LOG('🔊 Audio del avatar desbloqueado al obtener permiso de micrófono');
                }

                LOG('startAlwaysOnListening: modo SpeechRecognition (always-on)');
                _audioCaptureErrors = 0;
                _networkSpeechErrors = 0;
                recognition = setupRecognition();
                if (recognition) {
                    try {
                        recognition.start();
                        LOG('recognition.start() llamado (always-on)');
                    } catch (e) {
                        ERR('recognition.start() excepción (always-on):', e.name, e.message);
                        _alwaysOnActive = false;
                        stopListening();
                    }
                } else {
                    WARN('SpeechRecognition no disponible en este navegador');
                    _alwaysOnActive = false;
                    setState('ready', '⚠ SpeechRecognition no disponible');
                }
            });
        }

        function stopAlwaysOnListening() {
            LOG('stopAlwaysOnListening: deteniendo escucha continua');
            _alwaysOnActive = false;
            clearTimeout(_wakeBufferTimeout);
            if (recognition) {
                try { recognition.abort(); } catch (e) { LOG('abort() excepción (ignorada):', e.name); }
            }
            stopListening();
        }

        // ─── Enviar al LLM / backend (con streaming y burbujas) ─────────────────
        async function sendToLLM(text, isSleepWord = false) {
            if (!text) return;
            LOG(`sendToLLM: "${text}" (isSleepWord=${isSleepWord})`);
            setState('processing', 'Procesando…');
            setUserText(text, false);
            addChatBubble('user', text);

            const sessionid = document.getElementById('sessionid').value;

            if (isSleepWord) {
                stopAlwaysOnListening();
                const clean = text.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?¡!]/g,"");
                let farewellText = "De acuerdo. Si necesitas algo más, aquí estaré.";
                if (clean.includes('gracias') || clean.includes('chao') || clean.includes('adios') || clean.includes('luego')) {
                    farewellText = "De nada. ¡Que tengas un excelente día!";
                }

                queueAvatarBubble(farewellText);
                clearServerHistory();

                try {
                    await fetch('/human', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: farewellText,
                            type: 'echo',
                            interrupt: true,
                            sessionid: String(sessionid)
                        })
                    });
                } catch (err) {
                    ERR('sendToLLM farewell error:', err);
                }
                // NOTA: NO agregar burbuja "Conversación finalizada" aquí.
                // sleepModel(true) en el caller ya se encarga de mostrarla.
                return;
            }

            try {
                const res = await fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        type: 'chat',
                        interrupt: true,
                        stream: true,
                        sessionid: String(sessionid)
                    })
                });
                LOG('sendToLLM: respuesta status', res.status);
                
                if (!res.body) {
                    throw new Error("Respuesta del servidor no soporta streaming.");
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = '';
                let avatarBubble = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;

                    if (!avatarBubble && fullText.trim()) {
                        avatarBubble = addChatBubble('avatar', '');
                    }

                    if (avatarBubble) {
                        avatarBubble.textContent = fullText;
                        const container = document.getElementById('chat-container');
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    }
                }

                LOG('sendToLLM: stream de respuesta del LLM completado:', fullText);

            } catch (err) {
                ERR('sendToLLM: error de red o streaming:', err);
                setState('ready', 'Error de red — intenta de nuevo');
            }
        }

        // ─── Interrumpir avatar ────────────────────────────────────────────────────
        async function interruptAvatar() {
            LOG('interruptAvatar');
            const sessionid = document.getElementById('sessionid').value;
            try {
                await fetch('/interrupt_talk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionid: String(sessionid) })
                });
                LOG('interruptAvatar: solicitud enviada');
            } catch (e) { WARN('interruptAvatar: error de red', e); }

            setTimeout(() => {
                LOG('interruptAvatar: reiniciando always-on listening tras interrupción');
                isSpeaking = false;
                startAlwaysOnListening();
            }, 300);
        }

        // ─── Auto-conectar e Inicialización del Escáner al cargar ────────────────
        window.addEventListener('DOMContentLoaded', () => {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isFirefox = /Firefox\//.test(navigator.userAgent);

            LOG('DOMContentLoaded - isMobile:', isMobile, '| isFirefox:', isFirefox);
            LOG('Secure context:', window.isSecureContext, '| protocol:', location.protocol);

            if (!window.isSecureContext) {
                WARN('CONTEXTO NO SEGURO (HTTP). SpeechRecognition NO funcionara. Usar HTTPS.');
            }

            if (isFirefox) {
                WARN('Firefox detectado: SpeechRecognition NO disponible en Firefox.');
                WARN('Para usar el micrófono usa Chrome, Chromium o Edge.');
            }

            // Inicialización de Lector de Código de Barras (Módulo 1)
            const barcodeInp = document.getElementById('barcode-input');
            if (barcodeInp) {
                barcodeInp.focus();
                barcodeInp.addEventListener('keydown', async (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const code = barcodeInp.value.trim();
                        barcodeInp.value = '';
                        if (code) {
                            await handleBarcodeScan(code);
                        }
                    }
                });
            }
            setInterval(keepBarcodeFocus, 400);

            if (isMobile) {
                LOG('Mobile detectado - overlay visible, esperando tap');
            } else {
                LOG('Desktop detectado - auto-conectando.');
                const overlay = document.getElementById('tap-overlay');
                if (overlay) overlay.style.display = 'none';
                setTimeout(connectRTC, 800);
            }
        });
    </script>
</body>

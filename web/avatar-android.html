<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Avatar Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0c10;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            background: transparent;
        }

        /* Pantalla completa: solo en la primera conexión (sin histórico de frame) */
        #loading-indicator {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #0b0c10;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Badge pequeño: reconexiones post-primera-conexión, no tapa el avatar */
        #reconnect-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(10, 10, 20, 0.72);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 20px;
            padding: 5px 12px;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            display: none;
            align-items: center;
            gap: 7px;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
        #reconnect-badge.visible { display: flex; }
        .mini-spinner {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(99, 102, 241, 0.25);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <input type="hidden" id="sessionid" value="0">
    <div id="video-container">
        <video id="video" autoplay playsinline webkit-playsinline></video>

        <!-- Carga inicial: pantalla completa negra (solo la primera vez) -->
        <div id="loading-indicator">
            <div class="spinner"></div>
            <div id="loading-text">Conectando con el Avatar…</div>
        </div>

        <!-- Reconexión: badge pequeño, el último frame del avatar sigue visible -->
        <div id="reconnect-badge">
            <div class="mini-spinner"></div>
            <span id="reconnect-text">Reconectando…</span>
        </div>
    </div>

    <script>
        var pc = null;
        var isConnected = false;
        var isConnecting = false;
        var currentSessionId = "0";
        var reconnectTimer = null;
        var reconnectDelay = 1000;
        var lastVideoTime = -1;
        var stallCount = 0;
        var watchdogTimer = null;

        // Después del primer connect exitoso, los cortes muestran solo el badge
        // y NO la pantalla negra, preservando el último frame del avatar visible.
        var hasEverConnected = false;

        function log(msg) {
            console.log("[AvatarLive] " + msg);
            if (window.AndroidBridge && window.AndroidBridge.onLog) {
                window.AndroidBridge.onLog(msg);
            }
        }

        // ─── UI helpers ────────────────────────────────────────────────

        function hideLoading() {
            var loader = document.getElementById('loading-indicator');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() { loader.style.display = 'none'; }, 400);
            }
            hideBadge();
        }

        function showFullLoading(msg) {
            var loader = document.getElementById('loading-indicator');
            var text  = document.getElementById('loading-text');
            if (text && msg) text.textContent = msg;
            if (loader) { loader.style.display = 'flex'; loader.style.opacity = '1'; }
        }

        function showBadge(msg) {
            var badge = document.getElementById('reconnect-badge');
            var text  = document.getElementById('reconnect-text');
            if (text && msg) text.textContent = msg;
            if (badge) badge.classList.add('visible');
        }

        function hideBadge() {
            var badge = document.getElementById('reconnect-badge');
            if (badge) badge.classList.remove('visible');
        }

        // Selector: pantalla completa la primera vez, badge pequeño después.
        // El browser congela automáticamente el último frame cuando el track
        // termina, así el avatar permanece visible durante la reconexión.
        function showLoading(msg) {
            if (hasEverConnected) {
                showBadge(msg || "Reconectando…");
            } else {
                showFullLoading(msg || "Conectando con el Avatar…");
            }
        }

        // ─── Cleanup ────────────────────────────────────────────────────
        // NO se toca videoEl.srcObject para preservar el último frame visible.
        function cleanupRTC() {
            if (pc) {
                try {
                    pc.onconnectionstatechange = null;
                    pc.oniceconnectionstatechange = null;
                    pc.ontrack = null;
                    pc.close();
                } catch(e) {}
                pc = null;
            }
        }

        // ─── Reconexión con backoff ─────────────────────────────────────
        function scheduleReconnect(customDelay) {
            if (reconnectTimer || isConnecting) return;
            var delayMs = customDelay !== undefined ? customDelay : reconnectDelay;
            log("Programando reconexión en " + delayMs + " ms…");

            if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                window.AndroidBridge.onConnectionStateChange("connecting", "Reconectando…");
            }

            reconnectTimer = setTimeout(function() {
                reconnectTimer = null;
                reconnectDelay = Math.min(reconnectDelay * 1.5, 8000);
                connectRTC();
            }, delayMs);
        }

        // ─── Watchdog de video ──────────────────────────────────────────
        // 10 ticks × 1.5s = 15 segundos de stall antes de reconectar.
        // Previene falsos positivos en idle donde el avatar apenas se mueve.
        function startVideoWatchdog() {
            if (watchdogTimer) clearInterval(watchdogTimer);
            watchdogTimer = setInterval(function() {
                var videoEl = document.getElementById('video');
                if (isConnected && !isConnecting && videoEl && !videoEl.paused) {
                    if (videoEl.currentTime > 0 && videoEl.currentTime === lastVideoTime) {
                        stallCount++;
                        if (stallCount >= 10) {
                            log("Watchdog: Video congelado 15s. Reconectando…");
                            stallCount = 0;
                            isConnected = false;
                            showLoading("Recuperando transmisión…");
                            scheduleReconnect(1000);
                        }
                    } else if (videoEl.currentTime > 0) {
                        stallCount = 0;
                        lastVideoTime = videoEl.currentTime;
                    }
                }
            }, 1500);
        }

        // ─── Conexión WebRTC ────────────────────────────────────────────
        function connectRTC() {
            if (isConnecting) return;
            isConnecting = true;
            showLoading("Conectando…");
            cleanupRTC();

            var config = {
                sdpSemantics: 'unified-plan',
                iceServers: [
                    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }
                ]
            };

            try {
                pc = new RTCPeerConnection(config);
            } catch(e) {
                log("Error al crear RTCPeerConnection: " + e.message);
                isConnecting = false;
                scheduleReconnect(3000);
                return;
            }

            var videoEl = document.getElementById('video');

            pc.addEventListener('track', function(evt) {
                log("Track recibido: " + evt.track.kind);

                // Siempre asignar / actualizar srcObject al llegar el nuevo stream.
                if (evt.streams && evt.streams[0]) {
                    if (videoEl.srcObject !== evt.streams[0]) {
                        videoEl.srcObject = evt.streams[0];
                    }
                } else {
                    if (!videoEl.srcObject || !(videoEl.srcObject instanceof MediaStream)) {
                        videoEl.srcObject = new MediaStream();
                    }
                    var existing = videoEl.srcObject.getTracks().find(function(t) {
                        return t.id === evt.track.id;
                    });
                    if (!existing) videoEl.srcObject.addTrack(evt.track);
                }

                videoEl.muted = false;
                var playPromise = videoEl.play();
                if (playPromise !== undefined) {
                    playPromise.then(function() {
                        log("Video y audio reproduciendo exitosamente");
                        hasEverConnected = true;
                        isConnected = true;
                        reconnectDelay = 1000;
                        hideLoading();
                        if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                            window.AndroidBridge.onConnectionStateChange("connected", "Conectado");
                        }
                    }).catch(function(err) {
                        log("play() error: " + err.message);
                        setTimeout(function() {
                            videoEl.muted = false;
                            videoEl.play().catch(function(){});
                        }, 200);
                        hasEverConnected = true;
                        isConnected = true;
                        reconnectDelay = 1000;
                        hideLoading();
                        if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                            window.AndroidBridge.onConnectionStateChange("connected", "Conectado");
                        }
                    });
                }
            });

            pc.addEventListener('connectionstatechange', function() {
                if (!pc) return;
                log("Connection state: " + pc.connectionState);
                if (pc.connectionState === 'connected') {
                    hasEverConnected = true;
                    isConnected = true;
                    isConnecting = false;
                    reconnectDelay = 1000;
                    hideLoading();
                    if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                        window.AndroidBridge.onConnectionStateChange("connected", "Conectado");
                    }
                } else if (
                    pc.connectionState === 'disconnected' ||
                    pc.connectionState === 'failed' ||
                    pc.connectionState === 'closed'
                ) {
                    isConnected = false;
                    isConnecting = false;
                    showLoading("Reconectando…");
                    scheduleReconnect(3000);
                }
            });

            pc.addEventListener('iceconnectionstatechange', function() {
                if (!pc) return;
                log("ICE state: " + pc.iceConnectionState);
                if (
                    pc.iceConnectionState === 'failed' ||
                    pc.iceConnectionState === 'disconnected'
                ) {
                    if (isConnected) {
                        isConnected = false;
                        showLoading("Recuperando ICE…");
                        scheduleReconnect(3000);
                    }
                }
            });

            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            pc.createOffer().then(function(offer) {
                return pc.setLocalDescription(offer);
            }).then(function() {
                return new Promise(function(resolve) {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        var check = function() {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', check);
                                resolve();
                            }
                        };
                        pc.addEventListener('icegatheringstatechange', check);
                        setTimeout(resolve, 2000);
                    }
                });
            }).then(function() {
                var offer = pc.localDescription;
                log("Enviando oferta a /offer");
                return fetch('/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: offer.sdp, type: offer.type })
                });
            }).then(function(res) {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
            }).then(function(answer) {
                currentSessionId = String(answer.sessionid || "0");
                document.getElementById('sessionid').value = currentSessionId;
                log("Oferta aceptada, sessionid: " + currentSessionId);

                if (window.AndroidBridge && window.AndroidBridge.onSessionReady) {
                    window.AndroidBridge.onSessionReady(currentSessionId);
                }

                return pc.setRemoteDescription(answer);
            }).then(function() {
                isConnecting = false;
            }).catch(function(err) {
                log("Error conectando WebRTC: " + err.message);
                isConnected = false;
                isConnecting = false;
                showLoading("Sin servidor…");
                scheduleReconnect(3000);
            });
        }

        // ─── API pública ────────────────────────────────────────────────

        window.forceReconnect = function() {
            log("forceReconnect invocado");
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            isConnecting = false;
            connectRTC();
        };

        window.speakText = async function(text) {
            if (!text) return;
            log("speakText JS: " + text);
            try {
                var res = await fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        type: 'echo',
                        interrupt: true,
                        sessionid: currentSessionId
                    })
                });
                return await res.json();
            } catch(e) {
                log("speakText error: " + e.message);
                throw e;
            }
        };

        window.interruptTalk = async function() {
            log("interruptTalk JS");
            try {
                var res = await fetch('/interrupt_talk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionid: currentSessionId })
                });
                return await res.json();
            } catch(e) {}
        };

        // ─── Arranque ───────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', function() {
            log("DOM ready - iniciando WebRTC y watchdog");
            startVideoWatchdog();
            connectRTC();
        });
    </script>
</body>
</html>

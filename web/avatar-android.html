<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Avatar Live - Modo Directo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #0b0c10;
            --surface: #161722;
            --surface-elevated: #1e2030;
            --border: #2a2d43;
            --accent: #6366f1;
            --accent-glow: #818cf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
            transition: all 0.3s ease;
        }
        .status-badge.connected {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-color: var(--success);
        }
        .status-badge.speaking {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-glow);
            border-color: var(--accent-glow);
        }
        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border-color: var(--danger);
        }
        #video-wrap {
            flex: 1;
            position: relative;
            background: #0d0e15;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 10px 16px 6px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        #tap-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 12, 16, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 20;
            cursor: pointer;
        }
        #tap-overlay button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }
        .chips-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 16px;
            scrollbar-width: none;
        }
        .chips-container::-webkit-scrollbar {
            display: none;
        }
        .chip {
            white-space: nowrap;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chip:active {
            background: var(--surface-elevated);
        }
        .input-card {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            height: 60px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        textarea:focus {
            border-color: var(--accent);
        }
        .action-row {
            display: flex;
            gap: 10px;
        }
        .btn {
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary {
            flex: 1;
            background: var(--accent);
            color: #fff;
        }
        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        input[type="hidden"] {
            display: none;
        }
    </style>
</head>
<body>
    <input type="hidden" id="sessionid" value="0">
    <header>
        <div class="header-title">
            <span>👤</span> Avatar Live (Modo Directo)
        </div>
        <div id="status-badge" class="status-badge">
            <span id="status-text">Conectando…</span>
        </div>
    </header>

    <div id="video-wrap">
        <video id="video" autoplay playsinline></video>
        <div id="tap-overlay" onclick="startSession()">
            <button>▶ Conectar Avatar</button>
            <p style="font-size: 12px; color: var(--text-muted);">Toca para activar audio y video</p>
        </div>
    </div>

    <div class="chips-container">
        <div class="chip" onclick="setPreset('¡Hola! ¿En qué te puedo ayudar hoy?')">¡Hola! ¿En qué te ayudo?</div>
        <div class="chip" onclick="setPreset('¡Bienvenidos a nuestra tienda!')">¡Bienvenidos!</div>
        <div class="chip" onclick="setPreset('Tu solicitud ha sido procesada con éxito.')">Solicitud procesada</div>
        <div class="chip" onclick="setPreset('¡Muchas gracias por tu visita!')">Gracias por tu visita</div>
    </div>

    <div class="input-card">
        <textarea id="message" placeholder="Escribe el texto que el avatar debe decir..."></textarea>
        <div class="action-row">
            <button class="btn btn-danger" id="btn-stop" onclick="interrupt()">⏹ Detener</button>
            <button class="btn btn-primary" id="btn-send" onclick="sendText()">🗣️ Hablar</button>
        </div>
    </div>

    <script>
        var pc = null;
        var isConnected = false;

        function updateStatus(state, text) {
            var badge = document.getElementById('status-badge');
            var statusText = document.getElementById('status-text');
            badge.className = 'status-badge ' + state;
            statusText.textContent = text;
        }

        function setPreset(text) {
            document.getElementById('message').value = text;
            sendText();
        }

        function startSession() {
            var overlay = document.getElementById('tap-overlay');
            if (overlay) overlay.style.display = 'none';

            var videoEl = document.getElementById('video');
            videoEl.muted = false;
            connectRTC();
        }

        function connectRTC() {
            updateStatus('', 'Conectando…');

            var config = {
                sdpSemantics: 'unified-plan',
                iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
            };

            pc = new RTCPeerConnection(config);
            var videoEl = document.getElementById('video');
            var remoteStream = null;

            pc.addEventListener('track', function(evt) {
                if (evt.streams && evt.streams[0]) {
                    if (!remoteStream) {
                        remoteStream = evt.streams[0];
                        videoEl.srcObject = remoteStream;
                    } else if (videoEl.srcObject !== evt.streams[0]) {
                        remoteStream.addTrack(evt.track);
                    }
                } else {
                    if (!remoteStream) {
                        remoteStream = new MediaStream();
                        videoEl.srcObject = remoteStream;
                    }
                    remoteStream.addTrack(evt.track);
                }
                videoEl.play().catch(function(e) { console.log('play error:', e); });
            });

            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            pc.createOffer().then(function(offer) {
                return pc.setLocalDescription(offer);
            }).then(function() {
                return new Promise(function(resolve) {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        var check = function() {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', check);
                                resolve();
                            }
                        };
                        pc.addEventListener('icegatheringstatechange', check);
                        setTimeout(resolve, 2000);
                    }
                });
            }).then(function() {
                var offer = pc.localDescription;
                return fetch('/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: offer.sdp, type: offer.type })
                });
            }).then(function(res) {
                return res.json();
            }).then(function(answer) {
                document.getElementById('sessionid').value = answer.sessionid || "0";
                isConnected = true;
                updateStatus('connected', '🟢 Conectado');
                startMonitor();
                return pc.setRemoteDescription(answer);
            }).catch(function(err) {
                console.error(err);
                isConnected = false;
                updateStatus('disconnected', '🔴 Desconectado');
            });
        }

        async function sendText() {
            var msg = document.getElementById('message').value.trim();
            if (!msg) return;

            var sessionid = document.getElementById('sessionid').value;
            var btnSend = document.getElementById('btn-send');
            btnSend.disabled = true;
            updateStatus('speaking', '🗣️ Sintetizando…');

            try {
                var res = await fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: msg,
                        type: 'echo',
                        interrupt: true,
                        sessionid: String(sessionid)
                    })
                });
                if (res.ok) {
                    document.getElementById('message').value = '';
                }
            } catch (e) {
                console.error('Error sendText:', e);
            } finally {
                btnSend.disabled = false;
            }
        }

        async function interrupt() {
            var sessionid = document.getElementById('sessionid').value;
            try {
                await fetch('/interrupt_talk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionid: String(sessionid) })
                });
            } catch (e) {
                console.error('Error interrupt:', e);
            }
        }

        function startMonitor() {
            setInterval(async function() {
                if (!isConnected) return;
                var sessionid = document.getElementById('sessionid').value;
                try {
                    var res = await fetch('/is_speaking', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionid: String(sessionid) })
                    });
                    var data = await res.json();
                    if (data.data) {
                        updateStatus('speaking', '🗣️ Hablando…');
                    } else if (isConnected) {
                        updateStatus('connected', '🟢 Conectado');
                    }
                } catch (e) {}
            }, 800);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Avatar Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0c10;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            background: transparent;
        }
        #loading-indicator {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #0b0c10;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <input type="hidden" id="sessionid" value="0">
    <div id="video-container">
        <video id="video" autoplay playsinline webkit-playsinline></video>
        <div id="loading-indicator">
            <div class="spinner"></div>
            <div id="loading-text">Conectando con el Avatar…</div>
        </div>
    </div>

    <script>
        var pc = null;
        var isConnected = false;
        var currentSessionId = "0";

        function log(msg) {
            console.log("[AvatarLive] " + msg);
            if (window.AndroidBridge && window.AndroidBridge.onLog) {
                window.AndroidBridge.onLog(msg);
            }
        }

        function hideLoading() {
            var loader = document.getElementById('loading-indicator');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() {
                    if (loader && isConnected) loader.style.display = 'none';
                }, 300);
            }
        }

        function showLoading(msg) {
            var loader = document.getElementById('loading-indicator');
            var text = document.getElementById('loading-text');
            if (text && msg) text.textContent = msg;
            if (loader) {
                loader.style.display = 'flex';
                loader.style.opacity = '1';
            }
        }

        function connectRTC() {
            showLoading("Iniciando WebRTC…");
            if (pc) {
                try { pc.close(); } catch(e) {}
                pc = null;
            }

            var config = {
                sdpSemantics: 'unified-plan',
                iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
            };

            try {
                pc = new RTCPeerConnection(config);
            } catch(e) {
                log("Error al crear RTCPeerConnection: " + e.message);
                if (window.AndroidBridge && window.AndroidBridge.onError) {
                    window.AndroidBridge.onError("WebRTC error: " + e.message);
                }
                return;
            }

            var videoEl = document.getElementById('video');
            var remoteStream = null;

            pc.addEventListener('track', function(evt) {
                log("Track recibido: " + evt.track.kind);
                if (evt.streams && evt.streams[0]) {
                    if (!remoteStream) {
                        remoteStream = evt.streams[0];
                        videoEl.srcObject = remoteStream;
                    } else if (videoEl.srcObject !== evt.streams[0]) {
                        remoteStream.addTrack(evt.track);
                    }
                } else {
                    if (!remoteStream) {
                        remoteStream = new MediaStream();
                        videoEl.srcObject = remoteStream;
                    }
                    remoteStream.addTrack(evt.track);
                }

                videoEl.muted = false;
                var playPromise = videoEl.play();
                if (playPromise !== undefined) {
                    playPromise.then(function() {
                        log("Video y audio reproduciendo exitosamente");
                        isConnected = true;
                        hideLoading();
                        if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                            window.AndroidBridge.onConnectionStateChange("connected", "Conectado");
                        }
                    }).catch(function(err) {
                        log("play() error: " + err.message);
                        setTimeout(function() {
                            videoEl.muted = false;
                            videoEl.play().catch(function(){});
                        }, 200);
                        isConnected = true;
                        hideLoading();
                        if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                            window.AndroidBridge.onConnectionStateChange("connected", "Conectado");
                        }
                    });
                }
            });

            pc.addEventListener('connectionstatechange', function() {
                log("Connection state: " + pc.connectionState);
                if (pc.connectionState === 'connected') {
                    isConnected = true;
                    hideLoading();
                    if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                        window.AndroidBridge.onConnectionStateChange("connected", "Conectado");
                    }
                } else if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    isConnected = false;
                    showLoading("Conexión perdida");
                    if (window.AndroidBridge && window.AndroidBridge.onConnectionStateChange) {
                        window.AndroidBridge.onConnectionStateChange("disconnected", "Desconectado");
                    }
                }
            });

            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            pc.createOffer().then(function(offer) {
                return pc.setLocalDescription(offer);
            }).then(function() {
                return new Promise(function(resolve) {
                    if (pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        var check = function() {
                            if (pc.iceGatheringState === 'complete') {
                                pc.removeEventListener('icegatheringstatechange', check);
                                resolve();
                            }
                        };
                        pc.addEventListener('icegatheringstatechange', check);
                        setTimeout(resolve, 2000);
                    }
                });
            }).then(function() {
                var offer = pc.localDescription;
                log("Enviando oferta a /offer");
                return fetch('/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: offer.sdp, type: offer.type })
                });
            }).then(function(res) {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
            }).then(function(answer) {
                currentSessionId = String(answer.sessionid || "0");
                document.getElementById('sessionid').value = currentSessionId;
                log("Oferta aceptada, sessionid: " + currentSessionId);
                
                if (window.AndroidBridge && window.AndroidBridge.onSessionReady) {
                    window.AndroidBridge.onSessionReady(currentSessionId);
                }

                return pc.setRemoteDescription(answer);
            }).catch(function(err) {
                log("Error conectando WebRTC: " + err.message);
                isConnected = false;
                showLoading("Error de conexión: " + err.message);
                if (window.AndroidBridge && window.AndroidBridge.onError) {
                    window.AndroidBridge.onError(err.message || 'Error WebRTC');
                }
            });
        }

        // Funciones auxiliares accesibles desde JS o Kotlin
        window.speakText = async function(text) {
            if (!text) return;
            log("speakText JS: " + text);
            try {
                var res = await fetch('/human', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        type: 'echo',
                        interrupt: true,
                        sessionid: currentSessionId
                    })
                });
                return await res.json();
            } catch(e) {
                log("speakText error: " + e.message);
                throw e;
            }
        };

        window.interruptTalk = async function() {
            log("interruptTalk JS");
            try {
                var res = await fetch('/interrupt_talk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionid: currentSessionId })
                });
                return await res.json();
            } catch(e) {}
        };

        // Auto-conectar de inmediato al cargar la página
        window.addEventListener('DOMContentLoaded', function() {
            log("DOM ready - iniciando WebRTC automáticamente");
            connectRTC();
        });
    </script>
</body>
</html>
